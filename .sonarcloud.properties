# SonarCloud Automatic Analysis config (GitHub App).
# NOTE: Automatic Analysis IGNORES sonar-project.properties — this file is required.
# Keep in sync with sonar-project.properties where settings overlap.

sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.tests=tests

# Comma-separated paths (no recursive globs — Automatic Analysis limitation)
sonar.exclusions=scripts,.venv,venv,node_modules,data,.github,deploy,static/vendor,__pycache__
sonar.test.inclusions=tests
