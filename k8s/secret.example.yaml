# Copy to secret.yaml (DO NOT commit real values) and apply:
#   kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: blackdark-secrets
  namespace: blackdark
type: Opaque
stringData:
  DATABASE_URL: "postgresql://blackdark:CHANGE_ME@postgres:5432/blackdark"
  REDIS_URL: "redis://:CHANGE_ME@redis:6379/0"
  SECRETS_MASTER_KEY: "REPLACE_WITH_openssl_rand_hex_32"
  SESSION_TOKEN_PEPPER: "REPLACE_WITH_LONG_RANDOM"
  ADMIN_API_KEY: "REPLACE_ADMIN_API_KEY"
  ADMIN_TOTP_SECRET: "REPLACE_BASE32_TOTP_SECRET"
  ADMIN_EMAILS: "ops@example.com"
  APP_BASE_URL: "https://blackdark.example.com"
  VAULT_KEY_LAST_ROTATED_AT: "2026-03-28"
  # Optional OAuth
  OAUTH_GOOGLE_CLIENT_ID: ""
  OAUTH_GOOGLE_CLIENT_SECRET: ""
  OAUTH_GITHUB_CLIENT_ID: ""
  OAUTH_GITHUB_CLIENT_SECRET: ""
