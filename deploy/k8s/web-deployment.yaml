apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackdark-web
  labels:
    app: blackdark
    tier: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blackdark
      tier: web
  template:
    metadata:
      labels:
        app: blackdark
        tier: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: blackdark:latest
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: ADMIN_MFA_REQUIRED
              value: "true"
            - name: EXPOSE_B2B_DEMO_KEY
              value: "false"
            - name: PRODUCTION_GUARD_FAIL_CLOSED
              value: "true"
            - name: SERVICE_MODE
              value: web
            - name: ENV
              value: production
            - name: VIRAL_MODE
              value: "true"
            - name: SERVICE_BUS_LOCAL
              value: "false"
            - name: WEB_CONCURRENCY
              value: "4"
            - name: WEB_REPLICAS
              value: "2"
            - name: PG_POOL_MAX
              value: "40"
            - name: PG_POOL_MIN
              value: "4"
            - name: VIRAL_MAX_INFLIGHT
              value: "200"
            - name: VIRAL_ORACLE_CONCURRENCY
              value: "32"
            - name: VIRAL_ORACLE_RL_PER_MIN
              value: "60"
            - name: VIRAL_AUTH_RL_PER_MIN
              value: "30"
            - name: VIRAL_API_RL_PER_MIN
              value: "120"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: blackdark-secrets
                  key: redis-url
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: blackdark-secrets
                  key: database-url
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: blackdark-web-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: blackdark-web
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
