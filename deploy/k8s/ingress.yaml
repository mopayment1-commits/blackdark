apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blackdark-web
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Put Cloudflare / external WAF in front; origin only accepts proxy IPs when possible.
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.example.com
      secretName: blackdark-tls
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blackdark-web
                port:
                  number: 80
