apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blackdark-web-netpol
  labels:
    app: blackdark
spec:
  podSelector:
    matchLabels:
      app: blackdark
      tier: web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Postgres / Redis / HTTPS APIs (tighten CIDRs in real clusters)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blackdark-workers-netpol
  labels:
    app: blackdark
spec:
  podSelector:
    matchLabels:
      app: blackdark
      tier: worker
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 443
