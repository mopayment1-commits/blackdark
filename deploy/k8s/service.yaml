apiVersion: v1
kind: Service
metadata:
  name: blackdark-web
  labels:
    app: blackdark
    tier: web
spec:
  type: ClusterIP
  selector:
    app: blackdark
    tier: web
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
