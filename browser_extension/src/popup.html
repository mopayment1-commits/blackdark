<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BLACKDARK Oracle</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --fg: #e4e4e7;
      --muted: #71717a;
      --line: #2a2a35;
      --accent: #22d3ee;
      --act: #22c55e;
      --wait: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 320px;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background: radial-gradient(420px 220px at 10% -20%, #132033, var(--bg) 60%);
      color: var(--fg);
      padding: 14px;
    }
    h1 { font-size: 1rem; margin: 0 0 4px; letter-spacing: .04em; }
    .sub { color: var(--muted); font-size: .75rem; margin-bottom: 12px; }
    .row { display: flex; gap: 8px; margin-bottom: 10px; }
    input, button {
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #111118;
      color: var(--fg);
      padding: .55rem .7rem;
      font-size: .85rem;
    }
    input { flex: 1; }
    button {
      cursor: pointer;
      background: var(--accent);
      color: #041016;
      border: none;
      font-weight: 600;
    }
    button.secondary { background: transparent; color: var(--fg); border: 1px solid var(--line); }
    .verdict {
      font-size: 1.4rem;
      font-weight: 700;
      margin: 8px 0 4px;
    }
    .verdict.ACT, .verdict.BUY { color: var(--act); }
    .verdict.WAIT, .verdict.SELL, .verdict.HOLD { color: var(--wait); }
    .sentence { font-size: .9rem; line-height: 1.45; margin-bottom: 8px; }
    .meta { font-size: .72rem; color: var(--muted); word-break: break-all; }
    .foot { margin-top: 10px; font-size: .68rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }
    a { color: var(--accent); }
    .err { color: #f87171; font-size: .8rem; }
  </style>
</head>
<body>
  <h1>BLACKDARK</h1>
  <p class="sub">One clear decision · Act or Wait</p>
  <div class="row">
    <input id="symbol" value="BTC" maxlength="16" />
    <button id="ask">Ask</button>
  </div>
  <div id="out" class="sub">Ready</div>
  <div class="row">
    <button class="secondary" id="openLedger" style="flex:1">Accuracy Ledger</button>
    <button class="secondary" id="openOptions" style="flex:1">Settings</button>
  </div>
  <p class="foot"><strong>Anti-Hype</strong> · Not financial advice · Verify on the Public Accuracy Ledger.</p>
  <script type="module" src="popup.js"></script>
</body>
</html>
