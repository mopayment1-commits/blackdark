<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BLACKDARK Oracle · Settings</title>
  <style>
    body {
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background: #0a0a0f;
      color: #e4e4e7;
      max-width: 560px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
    input {
      width: 100%;
      padding: .65rem .75rem;
      border-radius: 8px;
      border: 1px solid #2a2a35;
      background: #111118;
      color: #e4e4e7;
    }
    button {
      margin-top: .75rem;
      padding: .55rem 1rem;
      border: none;
      border-radius: 8px;
      background: #22d3ee;
      color: #041016;
      font-weight: 600;
      cursor: pointer;
    }
    .muted { color: #71717a; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>BLACKDARK Oracle</h1>
  <p class="muted">API base URL (Railway production by default).</p>
  <label for="apiBase">API base</label>
  <input id="apiBase" placeholder="https://blackdark-production.up.railway.app" />
  <button id="save">Save</button>
  <p id="status" class="muted"></p>
  <script type="module" src="options.js"></script>
</body>
</html>
