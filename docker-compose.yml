# BLACKDARK — Microservices stack (local / production scale-out)
#
# Start: docker compose up -d --scale arbitrage=2 --scale web=2
# Web UI:     http://localhost:8080
# Health:     sidecar on port+100 (e.g. 8180 for web)

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blackdark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-blackdark}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackdark"]
      interval: 5s
      timeout: 3s
      retries: 5

  influxdb:
    image: influxdb:2.7-alpine
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER:-blackdark}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-blackdark-influx-dev}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-blackdark}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-blackdark}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-blackdark-dev-token}
      DOCKER_INFLUXDB_INIT_RETENTION: 730d
    volumes:
      - influxdata:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build: .
    ports:
      - "8080:8080"
      - "8180:8180"
    environment:
      SERVICE_MODE: web
      # Viral HA rehearsal: ENV=production + secrets (see .env.production.example)
      ENV: ${ENV:-}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-blackdark}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-blackdark}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-blackdark-dev-token}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-blackdark}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-blackdark}
      SERVICE_BUS_LOCAL: "false"
      VIRAL_MODE: "true"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      WEB_REPLICAS: ${WEB_REPLICAS:-2}
      PG_POOL_MIN: ${PG_POOL_MIN:-4}
      PG_POOL_MAX: ${PG_POOL_MAX:-40}
      VIRAL_MAX_INFLIGHT: ${VIRAL_MAX_INFLIGHT:-200}
      VIRAL_ORACLE_CONCURRENCY: ${VIRAL_ORACLE_CONCURRENCY:-32}
      KAFKA_BROKERS: kafka:9092
      # Optional local Vault -dev: docker compose --profile vault-dev up
      # Production secrets authority remains Fernet / private 0600 env files.
      RUN_AGGREGATOR: "false"
      INGESTION_ENABLED: "false"
      PORT: "8080"
      HEALTH_PORT: "8180"
      # Soft Launch must stay unset for viral rehearsal
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8180/health/live', timeout=2)"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2

  aggregator:
    build: .
    command: ["python", "run_service.py", "aggregator", "--port", "8091"]
    ports:
      - "8091:8091"
      - "8191:8191"
    environment:
      SERVICE_MODE: aggregator
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-blackdark}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-blackdark}
      RUN_AGGREGATOR: "true"
      HEALTH_PORT: "8191"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8191/health/live', timeout=2)"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1

  arbitrage:
    build: .
    command: ["python", "run_service.py", "arbitrage", "--port", "8092"]
    ports:
      - "8092:8092"
      - "8192:8192"
    environment:
      SERVICE_MODE: arbitrage
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-blackdark}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-blackdark}
      AUTO_EXECUTION_LOOP: "true"
      LOW_LATENCY_MODE: "true"
      EXCHANGE_WS_ENABLED: "true"
      HEALTH_PORT: "8192"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8192/health/live', timeout=2)"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1

  ingestion:
    build: .
    command: ["python", "run_service.py", "ingestion", "--port", "8093"]
    ports:
      - "8093:8093"
      - "8193:8193"
    environment:
      SERVICE_MODE: ingestion
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-blackdark}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-blackdark}
      KAFKA_BROKERS: kafka:9092
      INGESTION_ENABLED: "true"
      HEALTH_PORT: "8193"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8193/health/live', timeout=2)"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENERS_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # LOCAL ONLY — not production secrets infrastructure.
  # Enable explicitly: docker compose --profile vault-dev up
  # Production shipped secrets path = Fernet vault + private 0600 secret files.
  vault:
    profiles: ["vault-dev"]
    image: hashicorp/vault:1.17
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN:-blackdark-dev-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
  influxdata:
