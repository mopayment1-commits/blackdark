{# Shared Open Graph / Twitter Card image + site name (1200×630 social preview). #}
{% set _og_image = og_image | default('/static/img/blackdark-og-social-1200x630.jpg') %}
<meta property="og:site_name" content="BLACKDARK">
<meta property="og:image" content="{{ _og_image }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ _og_image }}">
