<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLACKDARK — Public Kill-Rate Board</title>
    <link rel="stylesheet" href="/static/css/trust-os.css">
    <style>
        :root { --bg:#07070c; --fg:#f4f1ea; --muted:#9a958c; --hot:#ef4444; --line:#24242f; --accent:#22d3ee; }
        body { margin:0; font-family: "IBM Plex Sans", "Segoe UI", sans-serif; background:
            radial-gradient(1200px 600px at 10% -10%, #2a1015 0%, transparent 55%),
            linear-gradient(160deg, #07070c, #12121a 60%, #0b1220); color:var(--fg); min-height:100vh; }
        nav { display:flex; justify-content:space-between; padding:1rem 1.5rem; border-bottom:1px solid var(--line); }
        nav a { color:var(--muted); text-decoration:none; margin-left:1rem; }
        .logo { font-family:"Syne", sans-serif; font-weight:800; color:var(--accent); text-decoration:none; letter-spacing:.04em; }
        main { max-width:820px; margin:0 auto; padding:2.5rem 1.25rem 4rem; }
        h1 { font-family:"Syne", sans-serif; font-size:clamp(2rem,5vw,3.2rem); line-height:1.05; margin:0 0 .75rem; }
        .sub { color:var(--muted); max-width:40rem; margin-bottom:1.75rem; }
        .hero-metric { font-size:clamp(3rem,10vw,5.5rem); font-weight:800; color:var(--hot); letter-spacing:-.03em; }
        .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:.75rem; margin:1.25rem 0 1.75rem; }
        .metric { border:1px solid var(--line); padding:1rem; background:rgba(255,255,255,.02); }
        .metric strong { display:block; font-size:1.35rem; }
        .metric span { color:var(--muted); font-size:.75rem; }
        .row { border-bottom:1px solid var(--line); padding:.65rem 0; font-size:.9rem; color:var(--muted); }
        .row b { color:var(--fg); }
        .btn { display:inline-block; margin-top:1rem; padding:.7rem 1.1rem; background:var(--hot); color:#fff; text-decoration:none; font-weight:700; }
        @media (max-width:700px){ .grid{grid-template-columns:1fr;} }
    </style>
</head>
<body>
<nav>
    <a class="logo" href="/">BLACKDARK</a>
    <div>
        <a href="/oracle-accuracy">Ledger</a>
        <a href="/proof-arena">Arena</a>
        <a href="/contradiction-replay">Replay</a>
    </div>
</nav>
<main>
    <h1>Public Kill-Rate Board</h1>
    <p class="sub" id="thesis">We publish how often we refuse weak edges — Net-Edge Truth, Contradiction Veto, Half-Life kill.</p>
    <div class="hero-metric" id="rate">—%</div>
    <p id="headline" class="sub"></p>
    <div class="grid">
        <div class="metric"><strong id="kills">—</strong><span>Total kills</span></div>
        <div class="metric"><strong id="truth">—</strong><span>Net-Edge reject rate</span></div>
        <div class="metric"><strong id="veto">—</strong><span>Veto kills</span></div>
    </div>
    <h2>Recent refusals</h2>
    <div id="recent"></div>
    <a class="btn" id="share" href="#" target="_blank" rel="noopener">Share the refusal</a>
    <p class="sub" style="margin-top:1.5rem;font-size:.75rem" id="disc"></p>
</main>
<script type="module">
async function load(){
  const r = await fetch('/api/public/kill-rate');
  const d = await r.json();
  document.getElementById('rate').textContent = (d.metrics?.kill_rate_percent ?? 0) + '%';
  document.getElementById('headline').textContent = d.headline || '';
  document.getElementById('thesis').textContent = d.thesis || '';
  document.getElementById('kills').textContent = d.metrics?.total_kills ?? 0;
  document.getElementById('truth').textContent = Math.round((d.metrics?.net_edge_reject_rate||0)*1000)/10 + '%';
  document.getElementById('veto').textContent = d.metrics?.contradiction_veto_kills ?? 0;
  document.getElementById('disc').textContent = d.disclaimer || '';
  const box = document.getElementById('recent');
  box.innerHTML = (d.recent_kills||[]).slice(0,12).map(k =>
    `<div class="row"><b>${k.source}</b> · ${k.reason} <span style="float:right">${(k.ts||'').slice(0,19)}</span></div>`
  ).join('') || '<div class="row">Board armed — kills appear as the engine refuses edges.</div>';
  document.getElementById('share').href = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(d.share_line||'BLACKDARK Kill-Rate');
}
await load();</script>
</body>
</html>
