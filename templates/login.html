<!DOCTYPE html>
<html lang="{{ lang|default('en') }}" dir="{{ dir|default('ltr') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('meta.title.login') }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Inter, sans-serif;
            background: #0a0a0f;
            color: #e4e4e7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card {
            width: min(420px, 100%);
            background: #111118;
            border: 1px solid #2a2a35;
            border-radius: 16px;
            padding: 2rem;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.35rem;
            background: linear-gradient(135deg, #22d3ee, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p { color: #71717a; font-size: 0.9rem; margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.8rem; color: #a1a1aa; margin-bottom: 0.35rem; }
        input {
            width: 100%;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            background: #1a1a24;
            border: 1px solid #2a2a35;
            border-radius: 10px;
            color: #e4e4e7;
        }
        button {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 0.75rem;
        }
        .btn-primary { background: linear-gradient(135deg, #22d3ee, #06b6d4); color: #0a0a0f; }
        .btn-secondary { background: #1a1a24; color: #e4e4e7; border: 1px solid #2a2a35; }
        .msg { font-size: 0.85rem; margin-top: 0.75rem; min-height: 1.2rem; }
        .msg.error { color: #ef4444; }
        .msg.ok { color: #22c55e; }
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
        .tab {
            flex: 1; text-align: center; padding: 0.5rem;
            border-radius: 8px; cursor: pointer;
            background: #1a1a24; color: #71717a; font-size: 0.85rem;
        }
        .tab.active { background: rgba(34,211,238,0.15); color: #22d3ee; }
        a { color: #22d3ee; text-decoration: none; font-size: 0.85rem; }
        .footer-links { text-align: center; margin-top: 1rem; }
        .lang-row { display:flex; justify-content:flex-end; margin-bottom:1rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="lang-row">{% include 'partials/lang_switcher.html' %}</div>
        <h1>BLACKDARK</h1>
        <p>🎁 <strong>{{ t('login.trial') }}</strong></p>

        <div class="tabs">
            <div class="tab active" id="tabLogin" onclick="showTab('login')">{{ t('login.tab.login') }}</div>
            <div class="tab" id="tabRegister" onclick="showTab('register')">{{ t('login.tab.register') }}</div>
        </div>

        <form id="loginForm" onsubmit="doLogin(event)">
            <label>{{ t('login.email') }}</label>
            <input type="email" id="loginEmail" required placeholder="you@email.com">
            <label>{{ t('login.password') }}</label>
            <input type="password" id="loginPassword" required minlength="8">
            <button type="submit" class="btn-primary">{{ t('login.submit') }}</button>
        </form>

        <form id="registerForm" style="display:none" onsubmit="doRegister(event)">
            <label>{{ t('login.name') }}</label>
            <input type="text" id="regName" placeholder="{{ t('login.name') }}">
            <label>{{ t('login.email') }}</label>
            <input type="email" id="regEmail" required>
            <label>{{ t('login.password_hint') }}</label>
            <input type="password" id="regPassword" required minlength="8">
            <button type="submit" class="btn-primary">{{ t('login.create') }}</button>
        </form>

        <div class="msg" id="msg"></div>
        <div class="footer-links">
            <a href="/?lang={{ lang }}">{{ t('login.home') }}</a> · <a href="/dashboard?lang={{ lang }}">{{ t('nav.dashboard') }}</a><br>
            <span style="color:#71717a;font-size:.75rem">{{ t('common.not_advice') }}</span>
        </div>
    </div>
    <script>
        function showTab(which) {
            const login = which === 'login';
            document.getElementById('loginForm').style.display = login ? 'block' : 'none';
            document.getElementById('registerForm').style.display = login ? 'none' : 'block';
            document.getElementById('tabLogin').classList.toggle('active', login);
            document.getElementById('tabRegister').classList.toggle('active', !login);
            document.getElementById('msg').textContent = '';
        }
        async function doLogin(e) {
            e.preventDefault();
            const msg = document.getElementById('msg');
            msg.className = 'msg';
            msg.textContent = '…';
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        email: document.getElementById('loginEmail').value,
                        password: document.getElementById('loginPassword').value,
                    }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Login failed');
                if (data.token) localStorage.setItem('bd_token', data.token);
                msg.className = 'msg ok';
                msg.textContent = 'OK';
                location.href = '/dashboard?lang={{ lang }}';
            } catch (err) {
                msg.className = 'msg error';
                msg.textContent = err.message || 'Error';
            }
        }
        async function doRegister(e) {
            e.preventDefault();
            const msg = document.getElementById('msg');
            msg.className = 'msg';
            msg.textContent = '…';
            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        name: document.getElementById('regName').value,
                        email: document.getElementById('regEmail').value,
                        password: document.getElementById('regPassword').value,
                    }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Register failed');
                if (data.token) localStorage.setItem('bd_token', data.token);
                msg.className = 'msg ok';
                msg.textContent = 'OK';
                location.href = '/dashboard?lang={{ lang }}';
            } catch (err) {
                msg.className = 'msg error';
                msg.textContent = err.message || 'Error';
            }
        }
    </script>
</body>
</html>
