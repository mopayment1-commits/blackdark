<!DOCTYPE html>
<html lang="{{ lang|default('en') }}" dir="{{ dir|default('ltr') }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLACKDARK — Corpus passport — diligence export</title>
    {% include "partials/seo_canonical.html" %}
<link rel="stylesheet" href="/static/css/trust-os.css">
<style>
:root{--bg:#070a0f;--fg:#f2efe6;--muted:#959188;--line:#243040;--accent:#22d3ee}
body{margin:0;color:var(--fg);font-family:"IBM Plex Sans",sans-serif;background:linear-gradient(165deg,#070a0f,#101820);min-height:100vh}
nav{display:flex;justify-content:space-between;padding:1rem 1.5rem;border-bottom:1px solid var(--line)}
nav a{color:var(--muted);text-decoration:none;margin-left:1rem}.logo{font-family:Syne,sans-serif;font-weight:800;color:var(--accent);text-decoration:none}
main{max-width:740px;margin:0 auto;padding:2.2rem 1.2rem 4rem}
.passport{border:1px solid var(--line);padding:28px;background:rgba(17,17,24,.92);border-radius:14px}
.kicker{text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--muted)}
h1{margin:.4rem 0 0;font-size:28px;color:var(--fg)}
.stamp{font-size:42px;font-weight:700;color:var(--accent);margin:18px 0 8px}
ul{line-height:1.55;color:var(--fg)}.foot{font-size:11px;color:var(--muted);margin-top:22px}
.btn{display:inline-block;margin:10px 8px 0 0;padding:10px 14px;background:#1a1a24;color:var(--fg);text-decoration:none;font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent)}
@media print{.noprint{display:none}body{background:#fff;color:#111}.passport{border:2px solid #111;background:#fff}}
</style></head>
<body>
<nav><a class="logo" href="/">BLACKDARK</a><div>
<a href="/kill-rate">Kill-Rate</a><a href="/oracle-accuracy">Ledger</a><a href="/data-room">Data Room</a>
</div></nav>
<main>
<div class="passport" data-evidence id="box">
<p class="kicker">Acquirer · Data Room · Corpus Passport</p>
<h1>BLACKDARK Corpus Passport</h1>
<p class="stamp" id="stamp">—</p>
<p id="headline"></p>
<ul id="stamps"></ul>
<p class="foot" id="disc"></p>
</div>
<p class="noprint">
<a class="btn" href="/contact">Request corpus passport PDF</a>
<a class="btn" href="/b2b/committee-one-pager">Committee One-Pager</a>
<a class="btn" href="/data-room">Data Room</a>
<a class="btn" href="/kill-rate">Kill-Rate</a>
</p>
</main>
<script src="/static/js/dom_escape.js"></script>
<script type="module">
const { esc } = window.BDDomSafe;
async function load(){
  let d=null;
  try{const r=await fetch('/api/due-diligence/corpus-passport'); if(r.ok) d=await r.json();}catch (error) { console.debug(error); }
  if(!d){const r=await fetch('/api/due-diligence/corpus-passport/public'); d=await r.json();
    d.stamps=[`Labeled (teaser): ${d.metrics?.labeled??0}`,`Kill-rate %: ${d.metrics?.kill_rate_percent??0}`,`Status: ${d.metrics?.registry_status||'—'}`,`Full passport requires Desk / Institutional session`];
    /* teaser passport already carries headline/disclaimer */
  }
  document.getElementById('stamp').textContent=(d.metrics?.labeled??0)+' labeled';
  document.getElementById('headline').textContent=d.headline||d.one_liner_for_ic||'';
  document.getElementById('stamps').innerHTML=(d.stamps||[]).map(s=>`<li>${esc(s)}</li>`).join('');
  document.getElementById('disc').textContent=d.disclaimer||'';
}
await load();</script>
</body></html>
