<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACKDARK — D5 Regime Honesty</title>
<link rel="stylesheet" href="/static/css/trust-os.css">
<style>
:root{--bg:#070a0f;--fg:#f2efe6;--muted:#959188;--line:#243040;--ok:#34d399;--warn:#f59e0b}
body{margin:0;color:var(--fg);font-family:"IBM Plex Sans",sans-serif;background:linear-gradient(165deg,#0a0c10,#1a1410);min-height:100vh}
nav{display:flex;justify-content:space-between;padding:1rem 1.5rem;border-bottom:1px solid var(--line)}
nav a{color:var(--muted);text-decoration:none;margin-left:1rem}.logo{font-family:Syne,sans-serif;font-weight:800;color:var(--warn);text-decoration:none}
main{max-width:800px;margin:0 auto;padding:2.2rem 1.2rem 4rem}
h1{font-family:Syne,sans-serif}.sub{color:var(--muted);line-height:1.55}
.box{border:1px solid var(--line);padding:1rem;margin:.7rem 0}
.flag{color:var(--warn);font-weight:700}
</style>
</head>
<body>
<nav><a class="logo" href="/">BLACKDARK</a><div>
<a href="/model-card">Model Card</a><a href="/institutional">Institutional</a>
</div></nav>
<main>
<h1>D5 Regime Honesty</h1>
<p class="sub" id="disc"></p>
<p class="flag" id="flags"></p>
<div id="rows"></div>
</main>
<script>
fetch('/api/public/d5-honesty').then(r=>r.json()).then(d=>{
  document.getElementById('disc').textContent = d.public_disclosure || '';
  document.getElementById('flags').textContent = 'bootstrap=' + d.bootstrap + ' · synthetic_any=' + d.synthetic_any + ' · mature_for_committee=' + d.mature_for_committee;
  (d.regimes||[]).forEach(r=>{
    const el=document.createElement('div'); el.className='box';
    el.innerHTML = '<strong>'+r.regime+'</strong><p class="sub">samples='+(r.samples??'—')+' · holdout='+(r.holdout_accuracy??'—')+' · synthetic='+r.synthetic_class_balance+'</p>';
    document.getElementById('rows').appendChild(el);
  });
});
</script>
</body>
</html>
