<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACKDARK — Buyer Model Card</title>
<link rel="stylesheet" href="/static/css/trust-os.css">
<style>
:root{--bg:#070a0f;--fg:#f2efe6;--muted:#959188;--line:#243040;--ok:#34d399}
body{margin:0;color:var(--fg);font-family:"IBM Plex Sans",sans-serif;background:linear-gradient(160deg,#070a0f,#132018 45%,#0b1016);min-height:100vh}
nav{display:flex;justify-content:space-between;padding:1rem 1.5rem;border-bottom:1px solid var(--line)}
nav a{color:var(--muted);text-decoration:none;margin-left:1rem}.logo{font-family:Syne,sans-serif;font-weight:800;color:var(--ok);text-decoration:none}
main{max-width:820px;margin:0 auto;padding:2.2rem 1.2rem 4rem}
h1{font-family:Syne,sans-serif;font-size:clamp(1.8rem,4vw,2.8rem)}
.sub{color:var(--muted);line-height:1.55}.box{border:1px solid var(--line);padding:1.1rem;margin:.8rem 0}
ul{color:var(--muted);line-height:1.55}
</style>
</head>
<body>
<nav><a class="logo" href="/">BLACKDARK</a><div>
<a href="/institutional">Institutional</a><a href="/d5-honesty">D5 Honesty</a><a href="/kill-rate">Kill-Rate</a>
</div></nav>
<main>
<h1 id="name">Model Card</h1>
<p class="sub" id="use"></p>
<div class="box"><h2>Out of scope</h2><ul id="oos"></ul></div>
<div class="box"><h2>Failure modes</h2><ul id="fail"></ul></div>
<div class="box"><h2>Bootstrap honesty</h2><p class="sub" id="boot"></p></div>
</main>
{% include "partials/site_footer.html" %}
<script type="module">
const __r = await fetch('/api/institutional/model-card');
const d = await __r.json();
  document.getElementById('name').textContent = d.model_name || 'Model Card';
  document.getElementById('use').textContent = d.intended_use || '';
  (d.out_of_scope||[]).forEach(x=>{const li=document.createElement('li');li.textContent=x;document.getElementById('oos').appendChild(li);});
  (d.failure_modes||[]).forEach(x=>{const li=document.createElement('li');li.textContent=x;document.getElementById('fail').appendChild(li);});
  document.getElementById('boot').textContent = 'bootstrap_honesty=' + ((d.performance_limits||{}).bootstrap_honesty);
</script>
</body>
</html>
