<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACKDARK — Zero-Tolerance</title>
<link rel="stylesheet" href="/static/css/trust-os.css">
<style>
:root{--bg:#070a0f;--fg:#f2efe6;--muted:#959188;--line:#243040;--ok:#34d399;--bad:#f87171}
body{margin:0;color:var(--fg);font-family:"IBM Plex Sans",sans-serif;background:linear-gradient(165deg,#070a0f,#151a22);min-height:100vh}
nav{display:flex;justify-content:space-between;padding:1rem 1.5rem;border-bottom:1px solid var(--line)}
nav a{color:var(--muted);text-decoration:none;margin-left:1rem}.logo{font-family:Syne,sans-serif;font-weight:800;color:var(--ok);text-decoration:none}
main{max-width:860px;margin:0 auto;padding:2.2rem 1.2rem 4rem}
h1{font-family:Syne,sans-serif;font-size:clamp(1.8rem,4vw,2.7rem);margin:0}
.sub{color:var(--muted);line-height:1.55;margin:.55rem 0 1.25rem}
.box{border:1px solid var(--line);padding:1.1rem;margin:.75rem 0}
.row{border-top:1px solid var(--line);padding:.75rem 0}.row:first-child{border-top:0}
.row h3{margin:0 0 .25rem;font-size:1rem}.row p{margin:0;color:var(--muted);font-size:.84rem;line-height:1.45}
.tag{color:var(--bad);font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;margin-right:.4rem}
code{color:var(--ok)}
</style>
</head>
<body>
<nav><a class="logo" href="/">BLACKDARK</a><div>
<a href="/anti-hype">Anti-Hype</a><a href="/priority-chain">Priority</a><a href="/oracle-accuracy">Ledger</a>
</div></nav>
<main>
<h1>Zero-Tolerance</h1>
<p class="sub" id="thesis">Prefer unknown over theater.</p>
<div class="box"><h2>Closure</h2><p class="sub" id="verdict"></p></div>
<div class="box"><h2>Seven defects</h2><div id="list"></div></div>
<p class="sub">API <code>/api/public/zero-tolerance-closure</code></p>
</main>
<script src="/static/js/dom_escape.js"></script>
<script type="module">
const { esc } = window.BDDomSafe;
async function load(){
  const d=await (await fetch('/api/public/zero-tolerance-closure')).json();
  document.getElementById('thesis').textContent=d.thesis||'';
  document.getElementById('verdict').textContent=
    `all_done=${d.all_done_for_agreed_scope} · deferred=${d.deferred_code_count} · defects=${d.defect_count}`;
  document.getElementById('list').innerHTML=(d.defects||[]).map(x=>`
    <div class="row"><h3><span class="tag">${esc(x.severity)}</span>${esc(x.name)}</h3>
    <p>${esc(x.rule)}</p></div>`).join('');
}
await load();</script>
</body></html>
