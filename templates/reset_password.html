<!DOCTYPE html>
<html lang="{{ lang|default('en') }}" dir="{{ dir|default('ltr') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLACKDARK — Reset password</title>
    <link rel="stylesheet" href="/static/css/trust-os.css">
    <style>
        body { font-family:var(--bd-font-body); background:#0a0a0f; color:#e4e4e7; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
        .card { width:min(420px,100%); background:#111118; border:1px solid #2a2a35; border-radius:16px; padding:2rem; animation: bdPulseIn .45s var(--bd-ease-out) both; }
        h1 { font-family:var(--bd-font-display); font-size:1.4rem; margin-bottom:.5rem; color:#22d3ee; }
        p { color:#71717a; font-size:.9rem; margin-bottom:1rem; }
        label { display:block; font-size:.8rem; color:#a1a1aa; margin-bottom:.35rem; }
        input { width:100%; padding:.75rem 1rem; margin-bottom:1rem; background:#1a1a24; border:1px solid #2a2a35; border-radius:10px; color:#e4e4e7; }
        button { width:100%; padding:.85rem; border:none; border-radius:10px; font-weight:700; cursor:pointer; background:linear-gradient(135deg,#22d3ee,#06b6d4); color:#0a0a0f; }
        .msg { margin-top:.75rem; font-size:.85rem; } .error { color:#ef4444; } .ok { color:#22c55e; }
        a { color:#22d3ee; }
    </style>
</head>
<body>
<div class="card">
    <h1>Set a new password</h1>
    <p>Use 12+ characters. Avoid common passwords. Other sessions will be signed out.</p>
    <form id="resetForm">
        <label for="password">New password</label>
        <input type="password" id="password" required minlength="12" autocomplete="new-password">
        <label for="password2">Confirm</label>
        <input type="password" id="password2" required minlength="12" autocomplete="new-password">
        <button type="submit" id="resetSubmitBtn">Update password</button>
    </form>
    <div class="msg" id="msg" role="alert"></div>
    <p style="margin-top:1rem"><a href="/login">Back to login</a></p>
</div>
<script>
async function readDetail(res) {
    try {
        const d = await res.json();
        if (typeof d.detail === 'string') return d.detail;
        if (d.detail && d.detail.message) return d.detail.message;
        return d.message || 'Request failed';
    } catch (_) {
        return 'Request failed';
    }
}
document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg');
    const btn = document.getElementById('resetSubmitBtn');
    const p1 = document.getElementById('password').value;
    const p2 = document.getElementById('password2').value;
    const token = new URLSearchParams(location.search).get('token') || '';
    if (!token) {
        msg.className = 'msg error';
        msg.textContent = 'Reset link is missing or invalid. Request a new link from Forgot password.';
        return;
    }
    if (p1 !== p2) {
        msg.className = 'msg error';
        msg.textContent = 'Passwords do not match.';
        return;
    }
    btn.disabled = true;
    btn.textContent = 'Updating…';
    const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ token, password: p1 })
    });
    if (!res.ok) {
        msg.className = 'msg error';
        msg.textContent = await readDetail(res);
        btn.disabled = false;
        btn.textContent = 'Update password';
        return;
    }
    const d = await res.json();
    try { localStorage.removeItem('bd_token'); localStorage.removeItem('token'); } catch (_) {}
    if (d.user) localStorage.setItem('bd_user', JSON.stringify(d.user));
    msg.className = 'msg ok';
    msg.textContent = d.message || 'Password updated. Redirecting to sign in…';
    setTimeout(() => { window.location.href = '/login?reset=1'; }, 900);
});
</script>
{% include "partials/site_footer.html" %}
</body>
</html>
