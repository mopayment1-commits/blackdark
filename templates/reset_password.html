<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLACKDARK — Reset password</title>
    <link rel="stylesheet" href="/static/css/trust-os.css">
    <style>
        body { font-family:var(--bd-font-body); background:#0a0a0f; color:#e4e4e7; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
        .card { width:min(420px,100%); background:#111118; border:1px solid #2a2a35; border-radius:16px; padding:2rem; animation: bdPulseIn .45s var(--bd-ease-out) both; }
        h1 { font-family:var(--bd-font-display); font-size:1.4rem; margin-bottom:.5rem; color:#22d3ee; }
        p { color:#71717a; font-size:.9rem; margin-bottom:1rem; }
        label { display:block; font-size:.8rem; color:#a1a1aa; margin-bottom:.35rem; }
        input { width:100%; padding:.75rem 1rem; margin-bottom:1rem; background:#1a1a24; border:1px solid #2a2a35; border-radius:10px; color:#e4e4e7; }
        button { width:100%; padding:.85rem; border:none; border-radius:10px; font-weight:700; cursor:pointer; background:linear-gradient(135deg,#22d3ee,#06b6d4); color:#0a0a0f; }
        .msg { margin-top:.75rem; font-size:.85rem; } .error { color:#ef4444; } .ok { color:#22c55e; }
        a { color:#22d3ee; }
    </style>
</head>
<body>
<div class="card">
    <h1>Set a new password</h1>
    <p>Use 10+ characters. Avoid common passwords. All other sessions will be signed out.</p>
    <form onsubmit="doReset(event)">
        <label>New password</label>
        <input type="password" id="password" required minlength="10" autocomplete="new-password">
        <label>Confirm</label>
        <input type="password" id="password2" required minlength="10" autocomplete="new-password">
        <button type="submit">Update password</button>
    </form>
    <div class="msg" id="msg"></div>
    <p style="margin-top:1rem"><a href="/login">Back to login</a></p>
</div>
<script>
async function doReset(e) {
    e.preventDefault();
    const msg = document.getElementById('msg');
    const p1 = document.getElementById('password').value;
    const p2 = document.getElementById('password2').value;
    if (p1 !== p2) { msg.className='msg error'; msg.textContent='Passwords do not match'; return; }
    const token = new URLSearchParams(location.search).get('token') || '';
    const res = await fetch('/api/auth/reset-password', {
        method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin',
        body: JSON.stringify({ token, password: p1 })
    });
    const d = await res.json();
    if (!res.ok) { msg.className='msg error'; msg.textContent = d.detail || 'Reset failed'; return; }
    if (d.token) { localStorage.setItem('bd_token', d.token); if (d.user) localStorage.setItem('bd_user', JSON.stringify(d.user)); }
    msg.className='msg ok'; msg.textContent='Password updated — redirecting…';
    setTimeout(() => location.href = '/profile?welcome=1', 800);
}
</script>
</body>
</html>
