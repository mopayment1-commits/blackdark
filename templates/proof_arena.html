<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLACKDARK — Proof Arena Lite</title>
    <link rel="stylesheet" href="/static/css/trust-os.css">
    <style>
        :root { --bg:#08090f; --fg:#f3efe6; --muted:#9a958c; --line:#262633; --accent:#34d399; --human:#60a5fa; }
        body { margin:0; color:var(--fg); font-family:"IBM Plex Sans",sans-serif; background:
            radial-gradient(900px 400px at 100% 0%, rgba(52,211,153,.12), transparent 50%), #08090f; min-height:100vh; }
        nav { display:flex; justify-content:space-between; padding:1rem 1.5rem; border-bottom:1px solid var(--line); }
        nav a { color:var(--muted); text-decoration:none; margin-left:1rem; }
        .logo { font-family:Syne,sans-serif; font-weight:800; color:var(--accent); text-decoration:none; }
        main { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
        h1 { font-family:Syne,sans-serif; font-size:clamp(1.8rem,4vw,2.8rem); }
        .sub { color:var(--muted); margin:.5rem 0 1.25rem; }
        .vs { display:grid; grid-template-columns:1fr 1fr; gap:.75rem; margin:1rem 0 1.5rem; }
        .panel { border:1px solid var(--line); padding:1rem; }
        .panel strong { font-size:2rem; display:block; }
        .panel.oracle strong { color:var(--accent); }
        .panel.human strong { color:var(--human); }
        label { font-size:.8rem; color:var(--muted); }
        input,select { width:100%; background:#12121a; border:1px solid var(--line); color:var(--fg); padding:.55rem .7rem; margin:.35rem 0 .85rem; }
        .btn { border:0; background:var(--accent); color:#042015; font-weight:800; padding:.7rem 1.1rem; cursor:pointer; }
        .row { border-bottom:1px solid var(--line); padding:.55rem 0; font-size:.88rem; color:var(--muted); }
        @media (max-width:640px){ .vs{grid-template-columns:1fr;} }
    </style>
</head>
<body>
<nav>
    <a class="logo" href="/">BLACKDARK</a>
    <div>
        <a href="/kill-rate">Kill-Rate</a>
        <a href="/oracle-accuracy">Ledger</a>
        <a href="/dashboard">Desk</a>
    </div>
</nav>
<main>
    <h1>Proof Arena Lite</h1>
    <p class="sub">Human vs Oracle — weekly discipline challenge. Not gambling. No prizes. Transparency only.</p>
    <p id="matchup" class="sub"></p>
    <div class="vs">
        <div class="panel human"><span>Humans</span><strong id="hRate">—</strong><small id="hMeta"></small></div>
        <div class="panel oracle"><span>Oracle</span><strong id="oRate">—</strong><small id="oMeta"></small></div>
    </div>
    <label for="userKey">Your key</label>
    <input id="userKey" placeholder="email or local id">
    <label for="symbol">Symbol</label>
    <input id="symbol" value="BTC">
    <label for="direction">Direction</label>
    <select id="direction">
        <option value="wait">WAIT</option>
        <option value="up">UP</option>
        <option value="down">DOWN</option>
    </select>
    <button class="btn" type="button" onclick="pick()">Submit weekly pick</button>
    <h2 style="margin-top:2rem">Leaderboard</h2>
    <div id="board"></div>
    <p class="sub" style="margin-top:1.5rem;font-size:.75rem" id="disc"></p>
</main>
<script type="module">
function _id(){const a=new Uint8Array(8);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');}
function key(){let k=(document.getElementById('userKey').value||'').trim(); if(!k){k=localStorage.getItem('bd_user_key')||('anon_'+_id()); localStorage.setItem('bd_user_key',k); document.getElementById('userKey').value=k;} return k;}
async function load(){
  const r=await fetch('/api/proof-arena/week'); const d=await r.json();
  document.getElementById('matchup').textContent=d.matchup_line||'';
  document.getElementById('hRate').textContent=(d.human?.hit_rate_percent??'—') + (d.human?.hit_rate_percent!=null?'%':'');
  document.getElementById('oRate').textContent=(d.oracle?.hit_rate_percent??0)+'%';
  document.getElementById('hMeta').textContent=`${d.human?.picks||0} picks · ${d.human?.wait||0} waits`;
  document.getElementById('oMeta').textContent=`${d.oracle?.samples||0} resolved samples`;
  document.getElementById('disc').textContent=d.disclaimer||'';
  document.getElementById('board').innerHTML=(d.leaderboard||[]).map(x=>
    `<div class="row"><b style="color:var(--fg)">${x.user}</b> · ${x.picks} picks · hit ${x.hit_rate_percent??'—'}%</div>`
  ).join('') || '<div class="row">Be first this week.</div>';
}
async function pick(){
  await fetch('/api/proof-arena/pick',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    user_key:key(), symbol:document.getElementById('symbol').value, direction:document.getElementById('direction').value
  })});
  await load();
}
Object.assign(window, { pick });
await load();</script>
</body>
</html>
