<!DOCTYPE html>
<html lang="{{ lang|default('en') }}" dir="{{ dir|default('ltr') }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACKDARK — {{ capability_title }}</title>
<link rel="icon" href="/static/img/favicon.ico">
<link rel="stylesheet" href="/static/css/trust-os.css">
<link rel="stylesheet" href="/static/css/capability.css">
</head>
<body class="cap-page" data-page="capability">
<nav class="cap-nav">
  <a class="cap-logo" href="/">BLACKDARK</a>
  <div>
    <a href="/dashboard">Dashboard</a>
    <a href="/exchanges">Exchanges</a>
    <a href="/stablecoins">Stablecoins</a>
    <a href="/arbitrage">Arbitrage</a>
    <a href="/brief">Brief</a>
    <a href="/whales">Whales</a>
    <a href="/liquidity">Liquidity</a>
    <a href="/defi">DeFi</a>
    <a href="/unlocks">Unlocks</a>
    <a href="/correlation">Correlation</a>
    <a href="/stress-test">Stress</a>
    <a href="/thesis">Thesis</a>
    <a href="/metrics-library">Metrics</a>
    <a href="/intelligence-ledger">Hub</a>
  </div>
</nav>
<main class="cap-main">
  <div id="riskScoreStrip" class="risk-score-strip">Loading risk scores…</div>
  <header class="cap-hero">
    <h1>{{ capability_title }}</h1>
    <p class="sub">{{ capability_subtitle }} — Monitoring &amp; analytics only. Not investment advice.</p>
    <p class="cap-decision-q" id="capDecisionQ">What should I do now?</p>
  </header>
  <div id="capRoot" data-capability="{{ capability_id }}" {% if thesis_asset %}data-thesis-asset="{{ thesis_asset }}"{% endif %}>
    <div class="cap-loading">Loading…</div>
  </div>
</main>
<div id="provPopover" class="prov-pop" role="dialog" aria-label="Provenance"></div>
<div id="decisionCardSticky" hidden></div>
<script src="/static/js/dom_safe.js"></script>
<script src="/static/js/capability_core.js"></script>
<script src="/static/js/decision_card_global.js"></script>
<script src="/static/js/capability_pages.js"></script>
</body>
</html>
