<!DOCTYPE html>
<html lang="{{ lang|default('en') }}" dir="{{ dir|default('ltr') }}">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACKDARK — Public miss feed — Oracle losses</title>
    {% include "partials/seo_canonical.html" %}
<link rel="stylesheet" href="/static/css/trust-os.css">
<style>
:root{--bg:#08060a;--fg:#f5f0e6;--muted:#9a948a;--line:#2a2430;--miss:#f87171;--accent:#22d3ee}
body{margin:0;color:var(--fg);font-family:"IBM Plex Sans",sans-serif;background:
 radial-gradient(900px 420px at 0% 0%,rgba(248,113,113,.14),transparent 55%),#08060a;min-height:100vh}
nav{display:flex;justify-content:space-between;padding:1rem 1.5rem;border-bottom:1px solid var(--line)}
nav a{color:var(--muted);text-decoration:none;margin-left:1rem}.logo{font-family:Syne,sans-serif;font-weight:800;color:var(--accent);text-decoration:none}
main{max-width:780px;margin:0 auto;padding:2.2rem 1.2rem 4rem}
h1{font-family:Syne,sans-serif;font-size:clamp(1.9rem,4.5vw,3rem);margin:0 0 .5rem}
.sub{color:var(--muted);margin-bottom:1.25rem;max-width:40rem;line-height:1.5}
.item{border:1px solid var(--line);padding:1rem 1.1rem;margin:.65rem 0;background:rgba(255,255,255,.02)}
.item b{color:var(--miss)}.meta{font-size:.8rem;color:var(--muted);margin-top:.35rem}
.btn{display:inline-block;margin-top:1rem;padding:.7rem 1.1rem;background:var(--miss);color:#111;text-decoration:none;border:none;cursor:pointer;font:800 inherit "IBM Plex Sans",sans-serif}
</style>
</head>
<body>
<nav><a class="logo" href="/">BLACKDARK</a><div>
<a href="/kill-rate">Kill-Rate</a><a href="/oracle-accuracy">Ledger</a><a href="/coverage-honesty">Coverage</a>
</div></nav>
<main>
<h1>Public Miss Feed</h1>
<p class="sub" id="thesis">We start with the miss. Brand is courage — not highlight reels.</p>
<p class="sub" id="meta"></p>
<div id="list"></div>
<button class="btn" type="button" id="share">Share the honesty</button>
</main>
<script src="/static/js/dom_escape.js"></script>
<script src="/static/js/public_decision_map.js"></script>
<script type="module">
const { esc, safeUrl } = window.BDDomSafe;
let missFeedShare = null;

function copyTextWithFallback(text) {
  const value = String(text || '').trim();
  if (!value) return false;
  try {
    const ta = document.createElement('textarea');
    ta.value = value;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if (ok) return true;
  } catch (_err) { /* fall through */ }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try {
      navigator.clipboard.writeText(value);
      return true;
    } catch (_err) { /* fall through */ }
  }
  return false;
}

function flashMissFeedShare(label, resetMs) {
  const btn = document.getElementById('share');
  if (!btn) return;
  const prev = btn.dataset.shareLabel || btn.textContent || 'Share the honesty';
  if (!btn.dataset.shareLabel) btn.dataset.shareLabel = prev;
  btn.textContent = label;
  window.clearTimeout(flashMissFeedShare._t);
  flashMissFeedShare._t = window.setTimeout(() => {
    btn.textContent = btn.dataset.shareLabel || 'Share the honesty';
  }, resetMs || 2200);
}

function openShareUrl(url) {
  const safe = (window.BDDomSafe && window.BDDomSafe.allowedNavigationUrl)
    ? window.BDDomSafe.allowedNavigationUrl(url)
    : safeUrl(url);
  if (!safe) return false;
  if (window.BDDomSafe && window.BDDomSafe.openWindow) {
    window.BDDomSafe.openWindow(safe);
    return true;
  }
  window.open(safe, '_blank', 'noopener');
  return true;
}

async function shareMissFeedHonesty(ev) {
  ev?.preventDefault?.();
  const d = missFeedShare || {};
  const text = String(d.share_text || '').trim();
  const urls = d.share_urls || {};
  const xUrl = urls.x || urls.twitter;
  const tgUrl = urls.telegram;
  const waUrl = urls.whatsapp;

  if (text && copyTextWithFallback(text)) {
    flashMissFeedShare('Copied!');
    return;
  }

  if (xUrl && openShareUrl(xUrl)) {
    flashMissFeedShare('Opened X');
    return;
  }
  if (tgUrl && openShareUrl(tgUrl)) {
    flashMissFeedShare('Opened Telegram');
    return;
  }
  if (waUrl && openShareUrl(waUrl)) {
    flashMissFeedShare('Opened WhatsApp');
    return;
  }

  if (navigator.share && text) {
    try {
      await navigator.share({
        title: 'BLACKDARK Miss Feed',
        text,
        url: 'https://blackdark.io/miss-feed',
      });
      flashMissFeedShare('Shared!');
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;
    }
  }

  flashMissFeedShare('Share unavailable', 2600);
}

function publicDecisionLabel(row) {
  if (row?.public_decision) return row.public_decision;
  const mapFn = window.BDPublicDecision?.mapPublicDecisionAction;
  if (typeof mapFn === 'function') return mapFn(row?.verdict ?? row?.action);
  return row?.verdict ?? '—';
}
async function load(){
  const shareBtn = document.getElementById('share');
  if (shareBtn) shareBtn.onclick = shareMissFeedHonesty;
  let d = {};
  try {
    const r = await fetch('/api/public/miss-feed?limit=40');
    d = await r.json();
    if (!r.ok) throw new Error('miss_feed_fail');
  } catch (err) {
    console.debug(err);
    const fallbackText = 'BLACKDARK Public Miss Feed — we publish misses first. https://blackdark.io/miss-feed';
    missFeedShare = {
      share_text: fallbackText,
      share_urls: {
        x: 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(fallbackText),
        telegram: 'https://t.me/share/url?url=' + encodeURIComponent('https://blackdark.io/miss-feed')
          + '&text=' + encodeURIComponent(fallbackText),
      },
    };
    document.getElementById('list').innerHTML = '<div class="item">Feed temporarily unavailable — you can still share the honesty link.</div>';
    return;
  }
  document.getElementById('thesis').textContent=d.thesis||'';
  document.getElementById('meta').textContent=`${d.count||0} shown · ${d.total_misses_in_window||0} labeled misses in window · Kill-Rate ${d.kill_rate_percent||0}%`;
  missFeedShare = {
    share_text: d.share_text || '',
    share_urls: d.share_urls || {},
  };
  document.getElementById('list').innerHTML=(d.items||[]).map(x=>`
    <div class="item" data-evidence>
      <div><b>MISS</b> · ${esc(x.asset)} · said ${esc(publicDecisionLabel(x))} · ${esc(x.label)}</div>
      <div class="meta">${esc((x.timestamp||'').slice(0,19))} · ${esc(x.lesson||'')} · <a href="${esc(safeUrl(x.verify_href)||'/oracle-accuracy')}" style="color:var(--accent)">verify</a></div>
    </div>`).join('') || '<div class="item">Feed armed — misses publish as outcomes resolve.</div>';
}
await load();</script>
</body></html>
