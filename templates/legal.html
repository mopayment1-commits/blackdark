<!DOCTYPE html>
<html lang="{{ lang|default('en') }}" dir="{{ dir|default('ltr') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLACKDARK — {{ title }}</title>
    <link rel="stylesheet" href="/static/css/trust-os.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--bd-font-body);
            background: radial-gradient(1000px 500px at 10% -10%, #132033 0%, #0a0a0f 55%);
            color: #e4e4e7;
            line-height: 1.7; padding: 2rem;
            max-width: 760px; margin: 0 auto;
        }
        h1 { font-family: var(--bd-font-display); font-size: 1.75rem; margin-bottom: 0.25rem; color: #22d3ee; letter-spacing: -.02em; }
        .meta { color: #71717a; font-size: 0.85rem; margin-bottom: 2rem; }
        .content h2 { font-size: 1.1rem; margin: 1.5rem 0 0.5rem; color: #22d3ee; }
        .content p { margin-bottom: 0.75rem; color: #d4d4d8; font-size: 0.95rem; }
        .content a { color: #22d3ee; }
        nav { margin-bottom: 2rem; font-size: 0.85rem; display: flex; flex-wrap: wrap; gap: .65rem 1rem; }
        nav a { color: #71717a; text-decoration: none; }
        nav a:hover, nav a.active { color: #22d3ee; }
        .logo { font-family: var(--bd-font-display); font-weight: 800; color: #22d3ee; letter-spacing: .04em; }
        main { animation: bdPulseIn .45s var(--bd-ease-out) both; }
    </style>
</head>
<body>
    <nav>
        <a class="logo" href="/">BLACKDARK</a>
        <a href="/legal">Legal hub</a>
        <a href="/terms" class="{{ 'active' if page == 'terms' else '' }}">Terms</a>
        <a href="/privacy" class="{{ 'active' if page == 'privacy' else '' }}">Privacy</a>
        <a href="/cookies" class="{{ 'active' if page == 'cookies' else '' }}">Cookies</a>
        <a href="/disclaimer" class="{{ 'active' if page == 'disclaimer' else '' }}">Disclaimer</a>
        <a href="/refund" class="{{ 'active' if page == 'refund' else '' }}">Refund</a>
    </nav>
    <main>
        <h1>{{ title }}</h1>
        <p class="meta">Updated {{ updated }}</p>
        <div class="content">{{ html | safe }}</div>
    </main>
    {% include "partials/site_footer.html" %}

<script type="module">
  const params = new URLSearchParams(location.search);
  if (params.get('need_ack') !== '1') return;
  const box = document.createElement('div');
  box.style.cssText = 'position:sticky;top:0;z-index:40;background:#0A0A0F;border-bottom:1px solid #22D3EE55;padding:12px 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between';
  box.innerHTML = '<span style="color:#E2E8F0;font:500 14px/1.4 IBM Plex Sans,sans-serif">Four-layer legal shield: acknowledge Terms to continue to decision surfaces.</span><button id="bdAckTerms" type="button" style="background:#22D3EE;color:#0A0A0F;border:0;padding:10px 14px;font:700 13px Syne,sans-serif;cursor:pointer">I acknowledge</button>';
  document.body.prepend(box);
  document.getElementById('bdAckTerms').onclick = async () => {
    await fetch('/api/legal/ack-terms', { method: 'POST', credentials: 'same-origin' });
    // Hard allowlist only — never assign user-controlled ?next= (CodeQL XSS/redirect).
    const destKey = params.get('next_key') || 'home';
    const ALLOWED = {
      home: '/',
      dashboard: '/dashboard',
      accuracy: '/oracle-accuracy',
      pricing: '/#pricing',
      login: '/login'
    };
    location.assign(ALLOWED[destKey] || '/');
  };
</script>

</body>
</html>
