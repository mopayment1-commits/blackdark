<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLACKDARK — {{ title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Inter, sans-serif;
            background: #0a0a0f; color: #e4e4e7;
            line-height: 1.7; padding: 2rem;
            max-width: 760px; margin: 0 auto;
        }
        h1 { font-size: 1.75rem; margin-bottom: 0.25rem; color: #22d3ee; }
        .meta { color: #71717a; font-size: 0.85rem; margin-bottom: 2rem; }
        .content h2 { font-size: 1.1rem; margin: 1.5rem 0 0.5rem; color: #a78bfa; }
        .content p { margin-bottom: 0.75rem; color: #d4d4d8; font-size: 0.95rem; }
        nav { margin-bottom: 2rem; font-size: 0.85rem; }
        nav a { color: #71717a; margin-right: 1rem; text-decoration: none; }
        nav a:hover, nav a.active { color: #22d3ee; }
        footer { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid #2a2a35; font-size: 0.8rem; color: #71717a; }
    </style>
</head>
<body>
    <nav>
        <a href="/">← Home</a>
        <a href="/terms" class="{{ 'active' if page == 'terms' else '' }}">Terms</a>
        <a href="/privacy" class="{{ 'active' if page == 'privacy' else '' }}">Privacy</a>
        <a href="/disclaimer" class="{{ 'active' if page == 'disclaimer' else '' }}">Disclaimer</a>
    </nav>
    <h1>{{ title }}</h1>
    <p class="meta">{{ title_ar }} · Updated {{ updated }}</p>
    <div class="content">{{ html | safe }}</div>
    <footer>
        © 2026 BLACKDARK. Not financial advice. <a href="/b2b" style="color:#22d3ee">B2B Feed</a>
    </footer>
</body>
</html>
