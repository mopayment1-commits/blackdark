<!DOCTYPE html>
<html lang="{{ lang|default('en') }}" dir="{{ dir|default('ltr') }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#22d3ee">
<title>BLACKDARK — Intelligence Hub</title>
<link rel="icon" href="/static/img/favicon.ico">
<link rel="stylesheet" href="/static/css/trust-os.css">
<style>
:root{
  --bg:#070a0f;--card:#0d1117;--elev:#161b22;--line:#243040;
  --fg:#f2efe6;--muted:#8b949e;--accent:#22d3ee;--ok:#34d399;--warn:#f59e0b;--err:#f87171;
  --seed:#a78bfa;--shadow:#60a5fa;--prod:#34d399;
}
*{box-sizing:border-box}
body{margin:0;color:var(--fg);font-family:"IBM Plex Sans",system-ui,sans-serif;
  background:linear-gradient(165deg,#070a0f 0%,#0d1520 50%,#070a0f 100%);min-height:100vh}
nav{display:flex;justify-content:space-between;align-items:center;padding:.85rem 1.25rem;
  border-bottom:1px solid var(--line);background:rgba(7,10,15,.92);backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:.5rem}
.logo{font-family:Syne,sans-serif;font-weight:800;color:var(--accent);text-decoration:none;font-size:1.1rem}
nav a{color:var(--muted);text-decoration:none;margin-left:1rem;font-size:.875rem}
nav a:hover,nav a.active{color:var(--fg)}
main{max-width:1400px;margin:0 auto;padding:1.25rem 1rem 3rem}
h1{font-family:Syne,sans-serif;font-size:clamp(1.6rem,3.5vw,2.4rem);margin:0 0 .25rem}
.sub{color:var(--muted);line-height:1.55;margin:0 0 1rem;font-size:.9rem}
.readiness{display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:1rem}
.chip{padding:.35rem .75rem;border-radius:999px;font-size:.75rem;border:1px solid var(--line);background:var(--card)}
.chip.ok{border-color:var(--ok);color:var(--ok)}.chip.warn{border-color:var(--warn);color:var(--warn)}
.layout{display:grid;grid-template-columns:320px 1fr;gap:1rem;min-height:70vh}
@media(max-width:960px){.layout{grid-template-columns:1fr}}
.sidebar,.content{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.sidebar{display:flex;flex-direction:column}
.search-wrap{padding:.75rem;border-bottom:1px solid var(--line)}
.search{width:100%;background:var(--elev);border:1px solid var(--line);color:var(--fg);
  border-radius:8px;padding:.55rem .75rem;font-size:.875rem}
.layers{padding:.5rem;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:.35rem}
.layer-btn{font-size:.7rem;padding:.3rem .55rem;border:1px solid var(--line);background:transparent;
  color:var(--muted);border-radius:999px;cursor:pointer}
.layer-btn.active,.layer-btn:hover{border-color:var(--accent);color:var(--accent)}
.module-list{flex:1;overflow-y:auto;max-height:calc(100vh - 280px)}
.module-item{padding:.65rem .85rem;border-bottom:1px solid var(--line);cursor:pointer;font-size:.82rem}
.module-item:hover{background:rgba(34,211,238,.05)}
.module-item.active{border-left:3px solid var(--accent);background:rgba(34,211,238,.08)}
.module-item .title{font-weight:600;color:var(--fg)}
.module-item .meta{font-size:.7rem;color:var(--muted);margin-top:.15rem}
.content{padding:1rem;display:flex;flex-direction:column}
.toolbar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.75rem;align-items:center}
.toolbar input,.toolbar select{background:var(--elev);border:1px solid var(--line);color:var(--fg);
  border-radius:8px;padding:.45rem .65rem;font-size:.8rem}
.btn{background:linear-gradient(135deg,var(--accent),#06b6d4);color:#000;border:none;
  border-radius:8px;padding:.5rem 1rem;font-weight:600;cursor:pointer;font-size:.8rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.secondary{background:var(--elev);color:var(--fg);border:1px solid var(--line)}
.state{padding:2rem;text-align:center;color:var(--muted)}
.state.error{color:var(--err)}.state.empty{font-style:italic}
.spinner{display:inline-block;width:24px;height:24px;border:2px solid var(--line);
  border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.evidence{display:inline-block;font-size:.68rem;padding:.2rem .5rem;border-radius:4px;
  font-weight:600;margin-left:.5rem}
.evidence.BACKTESTED{background:rgba(167,139,250,.15);color:var(--seed)}
.evidence.SHADOW_LIVE_FORWARD{background:rgba(96,165,250,.15);color:var(--shadow)}
.evidence.PRODUCTION_VERIFIED{background:rgba(52,211,153,.15);color:var(--prod)}
.evidence.SIMULATED{background:rgba(245,158,11,.15);color:var(--warn)}
.panel-body{flex:1;overflow-y:auto}
.card{background:var(--elev);border:1px solid var(--line);border-radius:10px;padding:.85rem;margin-bottom:.75rem}
.card h3{font-size:.85rem;color:var(--accent);margin:0 0 .5rem}
.display-line{font-size:1rem;font-weight:600;margin-bottom:.5rem;line-height:1.4}
.disclaimer{font-size:.72rem;color:var(--muted);border-left:3px solid var(--warn);padding:.5rem .75rem;
  margin-top:.75rem;background:rgba(245,158,11,.06)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.5rem}
.kv-item{background:rgba(0,0,0,.2);padding:.5rem;border-radius:6px;font-size:.78rem}
.kv-item .k{color:var(--muted);font-size:.68rem}
.kv-item .v{font-weight:600;margin-top:.15rem;word-break:break-all}
pre.raw{background:#0a0f14;padding:.75rem;overflow:auto;font-size:.7rem;border:1px solid var(--line);
  border-radius:8px;max-height:300px;margin-top:.75rem}
.tabs{display:flex;gap:.35rem;margin-bottom:.75rem}
.tab{font-size:.75rem;padding:.35rem .65rem;border:1px solid var(--line);background:transparent;
  color:var(--muted);border-radius:6px;cursor:pointer}
.tab.active{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<nav>
  <a class="logo" href="/">BLACKDARK</a>
  <div>
    <a href="/dashboard">Dashboard</a>
    <a href="/platform">Platform</a>
    <a href="/intelligence-ledger" class="active">Intelligence Hub</a>
    <a href="/launch-center">Launch Center</a>
    <a href="/cap646">CAP646</a>
    <a href="/institutional">Institutional</a>
  </div>
</nav>
<main>
  <h1>Intelligence Hub</h1>
  <p class="sub">محركات القرار — كل وحدة تعرض مكوّناً مخصصاً (ليس JSON خام). مُوسومة بفئة الأدلة. لا نصيحة استثمارية.</p>
  <div class="live-strip" id="liveStrip" style="display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:.75rem;font-size:.78rem"></div>
  <div class="readiness" id="readiness"></div>
  <div class="layout">
    <aside class="sidebar">
      <div class="search-wrap">
        <input class="search" id="searchInput" type="search" placeholder="بحث في الوحدات…" autocomplete="off">
      </div>
      <div class="layers" id="layerTabs"></div>
      <div class="module-list" id="moduleList">
        <div class="state"><span class="spinner"></span> جاري تحميل الكتالوج…</div>
      </div>
    </aside>
    <section class="content">
      <div id="panelHeader" hidden>
        <h2 id="panelTitle" style="margin:0 0 .25rem;font-size:1.1rem"></h2>
        <div id="panelMeta" style="font-size:.75rem;color:var(--muted);margin-bottom:.75rem"></div>
        <div class="toolbar" id="paramToolbar"></div>
        <div class="tabs">
          <button class="tab active" data-view="formatted">عرض منسق</button>
          <button class="tab" data-view="raw">JSON خام</button>
        </div>
      </div>
      <div class="panel-body" id="panelBody">
        <div class="state empty">اختر وحدة من القائمة لعرض البيانات.</div>
      </div>
    </section>
  </div>
</main>
<script src="/static/js/dom_escape.js"></script>
<script src="/static/js/dom_safe.js"></script>
<script src="/static/js/capability_core.js"></script>
<script src="/static/js/intelligence_hub_renderers.js"></script>
<script src="/static/js/intelligence_ledger.js"></script>
</body>
</html>
