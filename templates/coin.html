<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLACKDARK — Coin Detail</title>
    <link rel="stylesheet" href="/static/css/trust-os.css">
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root { --bg:#0a0a0f; --card:#111118; --border:#2a2a35; --text:#e4e4e7; --muted:#71717a; --accent:#22d3ee; --success:#22c55e; --danger:#ef4444; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:var(--bd-font-body, "IBM Plex Sans", sans-serif); background:var(--bg); color:var(--text); min-height:100vh; }
        nav { padding:.85rem 1.25rem; border-bottom:1px solid var(--border); }
        nav a { color:var(--accent); text-decoration:none; margin-right:1rem; }
        main { max-width:1100px; margin:0 auto; padding:1.5rem 1.25rem 3rem; }
        .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:1.25rem; margin-bottom:1rem; }
        .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:.75rem; }
        .stat { background:#1a1a24; border-radius:10px; padding:.75rem; }
        .stat label { display:block; font-size:.72rem; color:var(--muted); }
        .pos { color:var(--success); } .neg { color:var(--danger); }
        #chart { height:380px; }
        .loading { color:var(--muted); padding:2rem; text-align:center; }
    </style>
</head>
<body>
<nav>
    <a href="/platform">← Platform</a>
    <a href="/dashboard">Dashboard</a>
</nav>
<main>
    <div id="head" class="loading">Loading coin…</div>
    <div class="card"><div id="chart"></div></div>
    <div class="card"><div class="grid" id="stats"></div></div>
    <div class="card"><p id="desc" style="font-size:.9rem;color:var(--muted);line-height:1.6"></p></div>
</main>
<script type="module">
const coinId = {{ coin_id|tojson }};
const fmt = (n,d=2) => n==null?'—':Number(n).toLocaleString(undefined,{maximumFractionDigits:d});
function esc(s) {
    return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}
/** Plain text only via textContent — never regex strip / never assign untrusted HTML. */
function plainText(s, maxLen) {
    const d = document.createElement('div');
    d.textContent = String(s ?? '');
    const t = d.textContent || '';
    return maxLen ? t.slice(0, maxLen) : t;
}
let chart, series;

async function load() {
    const res = await fetch(`/api/platform/market/coin/${encodeURIComponent(coinId)}`);
    const c = await res.json();
    if (!c.available) {
        const head = document.getElementById('head');
        head.textContent = '';
        const miss = document.createElement('div');
        miss.className = 'loading';
        miss.textContent = 'Coin not found';
        head.appendChild(miss);
        return;
    }
    const name = plainText(c.name, 80);
    const symbol = plainText(c.symbol, 24);
    document.title = `BLACKDARK — ${name} (${symbol})`;
    const head = document.getElementById('head');
    head.textContent = '';
    const h1 = document.createElement('h1');
    h1.appendChild(document.createTextNode(name + ' '));
    const symSpan = document.createElement('span');
    symSpan.style.color = 'var(--muted)';
    symSpan.textContent = symbol;
    h1.appendChild(symSpan);
    const p = document.createElement('p');
    p.style.color = 'var(--muted)';
    p.style.marginTop = '.25rem';
    p.textContent = `$${fmt(c.price_usd)} · MCap $${fmt(c.market_cap_usd,0)}`;
    head.appendChild(h1);
    head.appendChild(p);
    document.getElementById('desc').textContent = plainText(c.description, 600);
    const ch = c.change_24h_pct||0;
    document.getElementById('stats').innerHTML = [
        ['24h', `${fmt(ch)}%`, ch>=0?'pos':'neg'],
        ['7d', `${fmt(c.change_7d_pct)}%`, (c.change_7d_pct||0)>=0?'pos':'neg'],
        ['30d', `${fmt(c.change_30d_pct)}%`, (c.change_30d_pct||0)>=0?'pos':'neg'],
        ['Vol 24h', `$${fmt(c.volume_24h_usd,0)}`, ''],
        ['ATH', `$${fmt(c.ath_usd)}`, ''],
        ['Circulating', fmt(c.circulating_supply,0), ''],
    ].map(([l,v,cls])=>`<div class="stat"><label>${esc(l)}</label><strong class="${esc(cls)}">${esc(v)}</strong></div>`).join('');

    const el = document.getElementById('chart');
    chart = LightweightCharts.createChart(el, {
        layout:{background:{color:'#111118'},textColor:'#a1a1aa'},
        grid:{vertLines:{color:'#2a2a35'},horzLines:{color:'#2a2a35'}},
    });
    series = chart.addAreaSeries({ lineColor:'#22d3ee', topColor:'rgba(34,211,238,.25)', bottomColor:'rgba(34,211,238,0)' });
    const spark = c.sparkline_7d||[];
    if (spark.length) {
        const now = Math.floor(Date.now()/1000);
        const step = 3600;
        series.setData(spark.map((p,i)=>({time: now - (spark.length-i)*step, value:p})));
        chart.timeScale().fitContent();
    } else {
        const sym = c.symbol;
        const k = await fetch(`/api/market/klines?symbol=${encodeURIComponent(sym)}&interval=1h&limit=120`);
        const payload = await k.json();
        const rows = payload.klines || [];
        series.setData(rows.map(r=>({time:Math.floor(r[0]/1000), value:+r[4]})));
        chart.timeScale().fitContent();
    }
}
await load();</script>
</body>
</html>
