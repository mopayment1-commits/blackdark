<!DOCTYPE html>
<html lang="{{ lang|default('en') }}" dir="{{ dir|default('ltr') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in required · BLACKDARK</title>
    <link rel="stylesheet" href="/static/css/trust-os.css">
    <style>
        :root { --bg:#0a0a0f; --card:#111118; --border:#2a2a35; --text:#e4e4e7; --muted:#71717a; --accent:#22d3ee; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--bd-font-body);
            background: radial-gradient(1200px 600px at 10% -10%, rgba(34,211,238,.12), transparent), var(--bg);
            color: var(--text); min-height:100vh; padding:0 1.5rem 1.5rem;
        }
        .gate-wrap {
            min-height: calc(100vh - 52px);
            display:flex; align-items:center; justify-content:center;
        }
        .card {
            width:min(520px,100%); background:var(--card); border:1px solid var(--border);
            border-radius:18px; padding:2rem;
        }
        h1 { font-family: var(--bd-font-display); font-size:1.75rem; margin-bottom:.5rem; color:var(--accent); }
        p { color:var(--muted); line-height:1.55; margin-bottom:1rem; }
        .lens-tag {
            display:inline-block; font-size:.75rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
            color:var(--accent); border:1px solid rgba(34,211,238,.35); border-radius:999px; padding:.2rem .55rem;
            margin-bottom:1rem;
        }
        .actions { display:flex; flex-wrap:wrap; gap:.65rem; margin-top:1.25rem; }
        .btn {
            display:inline-block; padding:.7rem 1.15rem; border-radius:10px; font-weight:700; text-decoration:none;
        }
        .btn-primary { background:linear-gradient(135deg,#22d3ee,#06b6d4); color:#041016; }
        .btn-secondary { border:1px solid var(--border); color:var(--text); background:#14141c; }
        .home { margin-top:1.25rem; font-size:.85rem; }
        a { color:var(--accent); text-decoration:none; }
    </style>
</head>
<body>
    {% include 'partials/global_header.html' %}
    <div class="gate-wrap">
        <main class="card" role="main">
            <div class="lens-tag">{{ lens_label }} lens</div>
            <h1>Account required</h1>
            <p>This dashboard surface needs a signed-in session. {{ lens_hint }}</p>
            {% if lens == 'prove' %}
            <p><a href="{{ public_prove_href }}">Open public Prove demo</a> on the homepage — no account needed.</p>
            {% endif %}
            <div class="actions">
                <a class="btn btn-primary" id="gateLoginBtn" href="/login{% if next_path %}?next={{ next_path | urlencode }}{% endif %}">Login</a>
                <a class="btn btn-secondary" href="/login?tab=register{% if next_path %}&amp;next={{ next_path | urlencode }}{% endif %}">Sign up</a>
            </div>
            <p class="home"><a href="/">← Back to homepage</a></p>
        </main>
    </div>
</body>
</html>
