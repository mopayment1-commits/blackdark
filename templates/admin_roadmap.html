<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLACKDARK — Platform Roadmap Audit</title>
    <style>
        :root { --bg:#0a0a0f; --card:#111118; --border:#2a2a35; --text:#e4e4e7; --muted:#71717a; --accent:#22d3ee; --ok:#22c55e; --warn:#f59e0b; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "IBM Plex Sans", system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.55; }
        nav { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .logo { color: var(--accent); font-weight: 800; text-decoration: none; }
        main { max-width: 1000px; margin: 0 auto; padding: 1.5rem; }
        h1 { margin-bottom: .35rem; }
        .sub { color: var(--muted); margin-bottom: 1.25rem; }
        .stat { display: inline-block; margin-right: 1rem; color: var(--accent); font-weight: 700; }
        table { width: 100%; border-collapse: collapse; font-size: .85rem; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        th, td { padding: .55rem .5rem; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
        th { color: var(--muted); }
        .pill { font-size: .7rem; font-weight: 700; padding: .12rem .45rem; border-radius: 999px; }
        .complete { background: rgba(34,197,94,.15); color: var(--ok); }
        .partial { background: rgba(245,158,11,.15); color: var(--warn); }
        .planned { background: rgba(113,113,122,.2); color: var(--muted); }
        a { color: var(--accent); }
    </style>
    <link rel="stylesheet" href="/static/css/legal-shield.css">
    <script defer src="/static/js/legal-shield.js"></script>
</head>
<body>
    <nav>
        <a class="logo" href="/">BLACKDARK</a>
        <div>
            <a href="/admin/launch">Launch</a> ·
            <a href="/admin/plan">Plan</a> ·
            <a href="/api/roadmap/audit">JSON</a>
        </div>
    </nav>
    <main>
        <h1>Platform Roadmap Audit</h1>
        <p class="sub">40-feature platform + infra map — English admin surface</p>
        <div id="summary" class="sub">Loading…</div>
        <div style="overflow-x:auto;margin-top:1rem">
            <table>
                <thead>
                    <tr><th>Status</th><th>Category</th><th>Title</th><th>Module</th><th>Endpoint</th><th>Note</th></tr>
                </thead>
                <tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody>
            </table>
        </div>
    </main>
    <script>
        async function load() {
            const res = await fetch('/api/roadmap/audit');
            const d = await res.json();
            const s = d.summary || {};
            document.getElementById('summary').innerHTML =
                `<span class="stat">${d.weighted_percent ?? d.complete_percent ?? '—'}%</span>` +
                `complete=${d.complete_count ?? '—'} · partial=${d.partial_count ?? '—'} · planned=${d.planned_count ?? '—'}`;
            const items = d.items || d.rows || d.roadmap || [];
            document.getElementById('rows').innerHTML = items.length
                ? items.map(i => `
                    <tr>
                        <td><span class="pill ${i.status||''}">${i.status||''}</span></td>
                        <td>${i.category||''}</td>
                        <td>${i.title||i.name||''}</td>
                        <td>${i.module||'—'}</td>
                        <td>${i.endpoint||'—'}</td>
                        <td style="color:var(--muted)">${i.note||''}</td>
                    </tr>`).join('')
                : '<tr><td colspan="6">No roadmap rows</td></tr>';
        }
        load().catch(() => {
            document.getElementById('summary').textContent = 'Could not load roadmap audit — admin access required';
        });
    </script>
</body>
</html>
