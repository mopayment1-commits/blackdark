# SonarCloud / SonarQube — BLACKDARK
# AA mode: GitHub App reads .sonarcloud.properties (this file ignored by AA).
# CI mode: disable AA, set SONAR_CI_ANALYSIS=true, scanner reads THIS file.
#
# Operating model: Automatic Analysis DISABLED; CI scanner + coverage.xml.
# New Code = Previous version (admin). This projectVersion marks the RC2 merge
# as the institutional baseline so subsequent main analyses measure post-RC2
# deltas — not the entire Aug-08→RC2 backlog window.
sonar.projectKey=mopayment1-commits_blackdark
sonar.organization=blackdark
sonar.projectName=blackdark
sonar.projectVersion=rc2-9618a76

sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.tests=tests
sonar.exclusions=\
  **/__pycache__/**,\
  **/.venv/**,\
  **/venv/**,\
  **/node_modules/**,\
  **/data/**,\
  **/*.joblib,\
  **/*.parquet,\
  **/static/vendor/**,\
  **/.github/**,\
  .github/**/*,\
  **/Dockerfile,\
  Dockerfile,\
  **/docker-compose*.yml,\
  scripts/**,\
  **/scripts/**,\
  deploy/**,\
  **/deploy/**

sonar.test.inclusions=tests/**/*.py,**/test_*.py
sonar.python.coverage.reportPaths=coverage.xml

# Coverage scoped to institutional money/security modules exercised by the
# Coverage XML suite. Other sources still receive bug/vuln/smell analysis.
# Non-Python / interactive / extension surfaces are coverage-excluded (not
# threshold gaming — they are outside the Cobertura suite by design).
sonar.coverage.inclusions=\
  **/fee_matrix.py,\
  **/money_decimal.py,\
  **/sql_safety.py,\
  **/executable_edge_truth.py,\
  **/path_safety.py,\
  **/profit_fee_algorithms.py,\
  **/fast_scan_engine.py,\
  **/slippage_guard.py,\
  **/arbitrage_engine.py,\
  **/gas_oracle.py,\
  **/defi_arbitrage_engine.py,\
  **/decision_enrichment.py,\
  **/env_secrets_loader.py,\
  **/alert_service.py,\
  **/telegram_bot_poller.py,\
  **/api/routers/observability.py
sonar.coverage.exclusions=\
  **/setup_*.py,\
  setup_*.py,\
  **/browser_extension/**,\
  **/sdk/**,\
  **/templates/**,\
  **/static/**,\
  **/*.js,\
  **/*.html,\
  **/*.css,\
  **/dashboard.py

