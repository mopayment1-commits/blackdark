# SonarCloud / SonarQube — BLACKDARK
sonar.projectKey=mopayment1-commits_blackdark
sonar.organization=mopayment1-commits
sonar.projectName=blackdark

# Language / encoding (closes analysis warnings)
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# Layout
sonar.sources=.
sonar.tests=tests
sonar.exclusions=\
  **/.__pycache__/**,\
  **/.venv/**,\
  **/venv/**,\
  **/node_modules/**,\
  **/data/**,\
  **/*.joblib,\
  **/*.parquet,\
  **/static/vendor/**

sonar.test.inclusions=tests/**/*.py,**/test_*.py
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=\
  scripts/**,\
  tests/**,\
  **/conftest.py,\
  setup_*.py,\
  run_service.py

# Keep CI noise focused on first-party app code
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S2260
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
