# SonarCloud / SonarQube — BLACKDARK
# Analysis method: Automatic Analysis (GitHub App) — do not also run CI scanner.
#
# IMPORTANT: Automatic Analysis IGNORES this file.
# Live AA settings live in .sonarcloud.properties (repo root).
# Keep this file for documentation + any future CI scanner switch.
sonar.projectKey=mopayment1-commits_blackdark
# Real SonarCloud org key (NOT the GitHub login). Confirmed via components/show API.
sonar.organization=blackdark
sonar.projectName=blackdark

# Language / encoding (mirrored in .sonarcloud.properties for Automatic Analysis)
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# Layout
sonar.sources=.
sonar.tests=tests
sonar.exclusions=\
  **/__pycache__/**,\
  **/.venv/**,\
  **/venv/**,\
  **/node_modules/**,\
  **/data/**,\
  **/*.joblib,\
  **/*.parquet,\
  **/static/vendor/**,\
  **/.github/**,\
  .github/**/*,\
  **/Dockerfile,\
  Dockerfile,\
  **/docker-compose*.yml,\
  scripts/**,\
  **/scripts/**,\
  deploy/**,\
  **/deploy/**

sonar.test.inclusions=tests/**/*.py,**/test_*.py
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=\
  scripts/**,\
  tests/**,\
  **/conftest.py,\
  setup_*.py,\
  run_service.py

# Ignore supply-chain IaC rules that conflict with pinned-range requirements.txt workflow
# and known false-positive path-injection on validated paper-grid persistence.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S2260
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*
sonar.issue.ignore.multicriteria.e3.ruleKey=docker:S8541
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*
sonar.issue.ignore.multicriteria.e4.ruleKey=docker:S8544
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*
sonar.issue.ignore.multicriteria.e5.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.e5.resourceKey=**/grid_bot.py
sonar.issue.ignore.multicriteria.e6.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.e6.resourceKey=**/scripts/**

sonar.issue.ignore.multicriteria.e7.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.e7.resourceKey=**/i18n_locales.py
sonar.issue.ignore.multicriteria.e8.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.e8.resourceKey=**/i18n_service.py
