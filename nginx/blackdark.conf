# BLACKDARK — reverse-proxy hardening (TLS terminator / CDN origin)
# Place behind Cloudflare or terminate TLS here. Not a full WAF replacement.

upstream blackdark_web {
    least_conn;
    server 127.0.0.1:8080;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=bd_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=bd_auth:10m rate=5r/s;

server {
    listen 443 ssl http2;
    server_name _;

    # ssl_certificate     /etc/ssl/certs/blackdark.pem;
    # ssl_certificate_key /etc/ssl/private/blackdark.key;
    # ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 8m;

    location /static/ {
        proxy_pass http://blackdark_web;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location /api/auth/ {
        limit_req zone=bd_auth burst=20 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://blackdark_web;
    }

    location / {
        limit_req zone=bd_api burst=60 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://blackdark_web;
    }

    location /health/live {
        proxy_pass http://blackdark_web;
        access_log off;
    }
}
