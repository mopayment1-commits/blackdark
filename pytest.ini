[pytest]
testpaths = tests
asyncio_mode = auto
python_files = test_*.py
markers =
    slow: institutional validation (>60s)
# Default runs skip slow institutional validation; use scripts/run_institutional_pytest.sh for cap646.
addopts = -m "not slow" -q

[coverage:run]
source =
    risk_manager
    oracle_audit_chain
    oracle_track_record
    sentiment_gate
    health_sidecar
    infra_metrics
    options_fetcher
    fast_scan_engine
    live_book_hub
    market_cache
    service_bus
    data_sources_registry
    graphql_schema
omit = tests/*

[coverage:report]
fail_under = 80
show_missing = true
precision = 1
