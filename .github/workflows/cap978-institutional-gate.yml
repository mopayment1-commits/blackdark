name: CAP978 Institutional Gate

on:
  push:
    branches: [main, master]
    paths:
      - "cap978/**"
      - "cap646/**"
      - "docs/cap978/**"
      - "tests/cap646/**"
      - "scripts/verify_institutional_closure.py"
  pull_request:
    paths:
      - "cap978/**"
      - "cap646/**"
      - "docs/cap978/**"
      - "tests/cap646/**"
      - "scripts/verify_institutional_closure.py"
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  gate-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==25.2"
          pip install --require-hashes --only-binary=:all: -r requirements.hashes.txt

      - name: Institutional gate (sample + artifacts)
        env:
          SERVICE_BUS_LOCAL: "true"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/bootstrap_free_human_ops.py --admin-email ci@blackdark.local
          python scripts/verify_institutional_closure.py --ci --write-checklist docs/cap978/COMMERCIAL_LAUNCH_CHECKLIST.json
          python scripts/run_soft_launch_closure.py
          set -a && source .env.softlaunch.local && set +a
          python -m pytest tests/cap646/test_institutional_gate.py tests/cap646/test_soft_launch_closure.py -q --tb=short -k "not test_institutional_gate_full"

  gate-full:
    if: github.event_name == 'schedule' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==25.2"
          pip install --require-hashes --only-binary=:all: -r requirements.hashes.txt

      - name: Full CAP978 institutional gate
        env:
          SERVICE_BUS_LOCAL: "true"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/verify_institutional_closure.py --full
          python -m pytest tests/cap646/test_institutional_gate.py::test_institutional_gate_full -q --tb=short
