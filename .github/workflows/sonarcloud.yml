        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==25.2"
          pip install --require-hashes --only-binary=:all: -r requirements.hashes.txt
          pip install "pytest-timeout==2.4.0"

      - name: Generate Cobertura coverage.xml
        env:
          SERVICE_BUS_LOCAL: "true"
          BLACKDARK_CI_DETERMINISTIC_CLOSURE: "true"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # Broad suite for Sonar Cobertura import (see workflow header: always produce coverage.xml).
