name: SonarCloud Analysis

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    # Gate via env — secrets.* is invalid in job-level if conditions.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: blackdark
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip when SONAR_TOKEN missing
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN not configured — skipping SonarCloud scan."

      - uses: actions/setup-python@v5
        if: env.SONAR_TOKEN != ''
        with:
          python-version: "3.12"

      - name: Install deps + coverage
        if: env.SONAR_TOKEN != ''
        run: |
          python -m pip install --upgrade "pip==25.2"
          # Hash-locked + wheels-only (closes githubactions:S8544 on New Code).
          pip install --require-hashes --only-binary=:all: -r requirements.hashes.txt

      - name: Generate coverage.xml
        if: env.SONAR_TOKEN != ''
        run: |
          python -m pytest tests/test_security.py tests/test_path_safety.py \
            tests/test_slippage_guard.py tests/test_profit_fee_algorithms.py \
            -q --tb=line --cov=. --cov-report=xml:coverage.xml \
            --cov-config=.coveragerc-profit-fee || true
          test -f coverage.xml

      # Prefer current action (sonarcloud-github-action is deprecated).
      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88ac5a3b0326a100327ff31095a3551bbc01b2 # v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=blackdark
            -Dsonar.projectKey=mopayment1-commits_blackdark
