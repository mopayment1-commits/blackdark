name: SonarCloud Analysis

# CI-based analysis (coverage import)
# ----------------------------------
# Automatic Analysis must stay DISABLED in SonarCloud → Administration →
# Analysis Method. This workflow always generates coverage.xml and runs the
# CI scanner (requires secret SONAR_TOKEN). Set repo variable
# SONAR_CI_ANALYSIS=false only to temporarily skip the scanner.
# Organization key: blackdark. Project key: mopayment1-commits_blackdark.

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-report:
    name: Coverage XML
    runs-on: ubuntu-latest
