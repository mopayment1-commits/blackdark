name: SonarCloud Analysis

# CI-based analysis (coverage import)
# ----------------------------------
# Automatic Analysis must stay DISABLED in SonarCloud → Administration →
# Analysis Method. This workflow always generates coverage.xml and runs the
# CI scanner (requires secret SONAR_TOKEN). Set repo variable
# SONAR_CI_ANALYSIS=false only to temporarily skip the scanner.
# Organization key: blackdark. Project key: mopayment1-commits_blackdark.

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  coverage-report:
    name: Coverage XML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==25.2"
          pip install --require-hashes --only-binary=:all: -r requirements.hashes.txt

      - name: Generate Cobertura coverage.xml
        run: |
          # Broad green suite for Sonar import. Exclude load/network + CI-flake DB suites.
          python -m pytest \
            tests/test_slippage_guard.py \
            tests/test_fee_matrix.py \
            tests/test_profit_fee_algorithms.py \
            tests/test_fast_scan_profit.py \
            tests/test_p0_financial_executability.py \
            tests/test_money_decimal.py \
            tests/test_p0_authz_hardening.py \
            tests/test_p1_session_hardening.py \
            tests/test_security.py \
            tests/test_security_hardening.py \
            tests/test_postgres_backend.py \
            tests/test_postgres_migration_integrity.py \
            tests/test_service_bus_distributed.py \
            tests/test_production_guard.py \
            tests/test_xss_sink_hardening.py \
            tests/test_unique_differentiators.py \
            tests/test_codeql_secret_logging_closure.py \
            tests/test_codeql_18_closure.py \
            tests/test_codeql_cleartext_logging_closure.py \
            tests/test_softlaunch_no_shell_taint.py \
            tests/test_path_safety.py \
            tests/test_arb_truth_gate.py \
            tests/test_sql_safety.py \
            tests/test_subscription_dialect_safety.py \
            tests/test_universe_rollout.py \
            tests/test_sonar_new_coverage_closure.py \
            tests/test_zero_tolerance.py \
            tests/test_viral_capacity.py \
            tests/test_dec_motion_and_oqs_weights.py \
            tests/test_english_ui_rule.py \
            tests/test_expert_execution_closure.py \
            tests/test_launch_hardening.py \
            tests/test_nonhuman_100_closure.py \
            tests/test_regime_models.py \
            tests/test_report_gap_closure.py \
            tests/test_trust_os_lenses_ux.py \
            tests/test_cso_priority_chain.py \
            tests/test_risk_manager.py \
            tests/test_security_max_closure.py \
            tests/test_radical_dd_scale_closure.py \
            tests/test_rc2_financial_truth.py \
            tests/test_rc2_chaos_resilience.py \
            tests/test_rc2_oracle_contract.py \
            tests/test_env_secrets_loader.py \
            tests/test_i18n_25_locales.py \
            tests/test_i18n_language_actually_switches.py \
            tests/test_sonar_template_js_parse_hygiene.py \
            tests/test_sonar_project_version_baseline.py \
            tests/cap646/test_batch01_dedicated.py \
            tests/cap646/test_batch01_production.py \
            tests/cap646/test_batch02_dedicated.py \
            tests/cap646/test_dedicated_common.py \
            tests/cap646/test_batch_spine.py \
            tests/cap646/test_cap69_dual_path.py \
            tests/cap646/test_runtime_spine_coverage.py \
            tests/cap646/test_closure_reject_04.py \
            tests/cap646/test_batch03_gateway_canonical_entitlement_contract.py \
            tests/cap646/test_batch03_reused_link_contract.py \
            tests/test_sonar_batch03_new_code_coverage.py \
            tests/test_spine_database.py \
            tests/test_spine_database_auth.py \
            tests/test_bigquery_export_mock.py \
            tests/cap646/test_institutional_gate.py \
            tests/test_sonar_pr356_new_code_coverage.py \
            tests/cap646/test_batch04_strangler_spine.py \
            tests/cap646/test_batch05_strangler_spine.py \
            tests/cap646/test_batch05_ids_contract.py \
            tests/cap646/test_batch05_prep_dedicated.py \
            -q --tb=line \
            --cov-config=.coveragerc-sonar \
            --cov \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=0
          test -s coverage.xml
          python - <<'PY2'
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          line_rate = float(root.attrib.get("line-rate") or 0)
          print(f"coverage line-rate={line_rate:.4f} ({line_rate*100:.1f}%)")
          print("NOTE: Broad green remediation suite for Sonar coverage import.")
          PY2

      - name: Upload coverage.xml
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  sonarcloud-ci:
    name: SonarCloud CI Scanner
    needs: coverage-report
    # Default ON now that AA is disabled. Opt out with SONAR_CI_ANALYSIS=false.
    if: ${{ vars.SONAR_CI_ANALYSIS != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Download coverage.xml
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-xml

      - name: Resolve sonar.projectVersion (engineering baseline)
        id: sonar_ver
        run: |
          test -s SONAR_PROJECT_VERSION
          VER="$(tr -d '[:space:]' < SONAR_PROJECT_VERSION)"
          test -n "$VER"
          # Guard: must match sonar-project.properties (single source of truth check).
          PROP="$(sed -n 's/^sonar.projectVersion=//p' sonar-project.properties | head -n1 | tr -d '[:space:]')"
          test "$VER" = "$PROP"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Using sonar.projectVersion=$VER (buildString=${GITHUB_SHA})"

      - name: SonarCloud Scan (AA must stay disabled)
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8 # v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.organization=blackdark
            -Dsonar.projectKey=mopayment1-commits_blackdark
            -Dsonar.projectVersion=${{ steps.sonar_ver.outputs.version }}
            -Dsonar.buildString=${{ github.sha }}
            -Dsonar.qualitygate.wait=true

  sonarcloud-skip-notice:
    name: SonarCloud
    if: ${{ vars.SONAR_CI_ANALYSIS == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Scanner explicitly skipped
        run: |
          echo "SONAR_CI_ANALYSIS=false — CI scanner skipped by variable."
          echo "coverage.xml is still produced by the Coverage XML job."
