            tests/test_free_tier_capabilities.py \
            tests/launch57/test_temporal_batch11.py \
            tests/launch57/test_identity_auth.py \
            -q --tb=line \
            --timeout=60 \
            --cov-config=.coveragerc-sonar \
            --cov \
            --cov=governance/launch57 \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=0
          PYTEST_EXIT=$?
          set -e
          if [ ! -s coverage.xml ]; then
            echo "ERROR: coverage.xml missing or empty (pytest exit=$PYTEST_EXIT)"
            exit 1
          fi
          python - <<'PY2'
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          line_rate = float(root.attrib.get("line-rate") or 0)
          print(f"coverage line-rate={line_rate:.4f} ({line_rate*100:.1f}%)")
          print("NOTE: Cobertura XML for Sonar import; step fails only if coverage.xml is absent.")
          PY2
          if [ "$PYTEST_EXIT" -ne 0 ]; then
            echo "WARNING: pytest exited $PYTEST_EXIT — coverage.xml still published; Sonar CI job will run."
          fi

