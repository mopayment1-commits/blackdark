name: SonarCloud Analysis

# CI-based analysis (coverage import)
# ----------------------------------
# Automatic Analysis must stay DISABLED in SonarCloud → Administration →
# Analysis Method. This workflow always generates coverage.xml and runs the
# CI scanner (requires secret SONAR_TOKEN). Set repo variable
# SONAR_CI_ANALYSIS=false only to temporarily skip the scanner.
# Organization key: blackdark. Project key: mopayment1-commits_blackdark.

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  coverage-report:
    name: Coverage XML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==25.2"
          pip install --require-hashes --only-binary=:all: -r requirements.hashes.txt

      - name: Generate Cobertura coverage.xml
        run: |
          # Full green tree for Sonar import (exclude load/network markers only).
          # Main-branch New Code windows are broader than PR diffs — the subset
          # suite left new_coverage ~30% on main; full tree is required.
          python -m pytest tests/ -m "not load and not network" \
            -q --tb=line \
            --cov-config=.coveragerc-sonar \
            --cov \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=0
          test -s coverage.xml
          python - <<'PY2'
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          line_rate = float(root.attrib.get("line-rate") or 0)
          print(f"coverage line-rate={line_rate:.4f} ({line_rate*100:.1f}%)")
          print("NOTE: Full green tests/ tree for Sonar coverage import.")
          PY2

      - name: Upload coverage.xml
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  sonarcloud-ci:
    name: SonarCloud CI Scanner
    needs: coverage-report
    # Default ON now that AA is disabled. Opt out with SONAR_CI_ANALYSIS=false.
    if: ${{ vars.SONAR_CI_ANALYSIS != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage.xml
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml

      - name: SonarCloud Scan (AA must stay disabled)
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.organization=blackdark
            -Dsonar.projectKey=mopayment1-commits_blackdark
            -Dsonar.qualitygate.wait=true

  sonarcloud-skip-notice:
    name: SonarCloud
    if: ${{ vars.SONAR_CI_ANALYSIS == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Scanner explicitly skipped
        run: |
          echo "SONAR_CI_ANALYSIS=false — CI scanner skipped by variable."
          echo "coverage.xml is still produced by the Coverage XML job."
