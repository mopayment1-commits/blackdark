name: SonarCloud Analysis

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    # Requires repository secret SONAR_TOKEN (SonarCloud project token).
    if: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps + coverage
        run: |
          python -m pip install --upgrade "pip==25.2"
          python -m pip install --only-binary=:all: -r requirements.txt "pytest-cov==6.2.1" || \
            python -m pip install --prefer-binary -r requirements.txt "pytest-cov==6.2.1"

      - name: Generate coverage.xml
        run: |
          python -m pytest tests/test_security.py tests/test_path_safety.py \
            tests/test_slippage_guard.py tests/test_profit_fee_algorithms.py \
            -q --tb=line --cov=. --cov-report=xml:coverage.xml \
            --cov-config=.coveragerc-profit-fee || true
          test -f coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
