name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  dependency-scan-gate:
    name: Dependency & SBOM Scan Gate (#1044)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install hash-locked deps + pip-audit
        run: |
          python -m pip install --upgrade "pip==25.2"
          pip install --require-hashes --only-binary=:all: -r requirements.hashes.txt
          pip install --only-binary=:all: pip-audit==2.9.0
      - name: Run dependency scan gate (CVE + pinning + license + SBOM)
        run: python scripts/run_dependency_scan_gate.py --json
      - name: Dependency scan gate unit tests
        run: >-
          env -u BLACKDARK_TEST_DATABASE_URL -u DATABASE_URL
          python -m pytest tests/test_dependency_scan_gate.py -q --tb=short

  pytest-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: "pip install --require-hashes --only-binary=:all: -r requirements.hashes.txt"
      - run: >-
          python -m pytest
          tests/test_security.py
          tests/test_security_hardening.py
          tests/test_risk_manager.py
          tests/test_radical_dd_scale_closure.py
          tests/test_d01_data_state.py
          tests/test_d02_secrets_vault.py
          tests/test_d06_institutional_api.py
          tests/test_d09_flow_filter.py
          tests/test_d13_auth_abuse.py
          tests/test_d15_evidence_closure.py
          -q

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: "pip install --only-binary=:all: bandit==1.8.3"
      - run: "bandit -r . -c .bandit -ll -q"
