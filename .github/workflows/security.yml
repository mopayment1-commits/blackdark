name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Quote the run string — unquoted `:all:` breaks YAML mapping parse.
      - run: "pip install --only-binary=:all: pip-audit==2.9.0"
      # Audit the hash-locked tree used by CI (Sonar S8541 / S8544).
      - run: "pip-audit -r requirements.hashes.txt --desc"

  pytest-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: "pip install --require-hashes --only-binary=:all: -r requirements.hashes.txt"
      - run: >-
          python -m pytest
          tests/test_security.py
          tests/test_security_hardening.py
          tests/test_risk_manager.py
          tests/test_radical_dd_scale_closure.py
          tests/test_d01_data_state.py
          tests/test_d02_secrets_vault.py
          tests/test_d06_institutional_api.py
          tests/test_d09_flow_filter.py
          tests/test_d13_auth_abuse.py
          tests/test_d15_evidence_closure.py
          -q

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: "pip install --only-binary=:all: bandit==1.8.3"
      - run: "bandit -r . -c .bandit -ll -q"

  dast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: "pip install --require-hashes --only-binary=:all: -r requirements.hashes.txt"
      - name: DAST gate (ASGI smoke + RBAC/TLS/leak checks)
        run: "python scripts/run_dast_gate.py --json"
      - name: DAST gate policy e2e
        run: "python -m pytest tests/test_dast_gate.py -q --tb=short"
      - name: Weekly staging DAST (optional)
        if: github.event_name == 'schedule' && vars.DAST_STAGING_URL != ''
        env:
          DAST_TARGET_URL: ${{ vars.DAST_STAGING_URL }}
          DAST_PRODUCTION_READ_ONLY: "true"
        run: "python scripts/run_dast_gate.py --mode weekly --json"
