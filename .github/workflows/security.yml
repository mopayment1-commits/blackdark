name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # Fail closed on known vulnerable deps — fix or pin before merge.
      - run: pip-audit -r requirements.txt --desc

  pytest-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt cryptography
      - run: python -m pytest tests/test_security.py tests/test_risk_manager.py tests/test_radical_dd_scale_closure.py -q
