name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (fail-closed)
        run: |
          python -m pip install "pip-audit>=2.7,<3"
          python -m pip_audit -r requirements.txt --strict
          # Fail-closed: any known vuln in requirements.txt fails the job.
          # Local: python -m pip_audit -r requirements.txt --strict
          # Prefer -r requirements.txt over bare env audit (system pip noise).

  pytest-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt cryptography
      - run: python -m pytest tests/test_security.py tests/test_risk_manager.py -q
