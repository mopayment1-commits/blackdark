name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (fail-closed)
        run: |
          python -m pip install --upgrade "pip==25.2"
          python -m pip install --only-binary :all: "pip-audit==2.9.0"
          python -m pip_audit -r requirements.txt --strict
          # Fail-closed: any known vuln in requirements.txt fails the job.
          # Local: python -m pip_audit -r requirements.txt --strict

  pytest-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade "pip==25.2"
          python -m pip install --only-binary :all: -r requirements.txt cryptography
      - run: python -m pytest tests/test_security.py tests/test_risk_manager.py -q
