name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Quote the run string — unquoted `:all:` breaks YAML mapping parse.
      - run: "pip install --only-binary=:all: pip-audit==2.9.0"
      # Audit the hash-locked tree used by CI (Sonar S8541 / S8544).
      - run: "pip-audit -r requirements.hashes.txt --desc"

  pytest-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: "pip install --require-hashes --only-binary=:all: -r requirements.hashes.txt"
      - run: >-
          python -m pytest
          tests/test_security.py
          tests/test_security_hardening.py
          tests/test_risk_manager.py
          tests/test_radical_dd_scale_closure.py
          tests/test_d01_data_state.py
          tests/test_d02_secrets_vault.py
          tests/test_d06_institutional_api.py
          tests/test_d09_flow_filter.py
          tests/test_d13_auth_abuse.py
          tests/test_d15_evidence_closure.py
          -q

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: "pip install --only-binary=:all: bandit==1.8.3"
      - run: "bandit -r . -c .bandit -ll -q"
