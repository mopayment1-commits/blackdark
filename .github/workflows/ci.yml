name: CI Full Test Suite

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pin action major tags; versions are also locked in requirements*.txt for Python deps.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==25.2"
          # Prefer wheels only (no sdist setup-script execution).
          python -m pip install --only-binary :all: -r requirements.txt "pytest-cov==6.2.1"

      - name: Ruff lint (fail-closed)
        run: python -m ruff check .

      - name: Profit/fee module tests (90% gate)
        run: |
          python -m pytest tests/test_slippage_guard.py tests/test_fee_matrix.py \
            tests/test_profit_fee_algorithms.py tests/test_fast_scan_profit.py \
            -q --tb=short --cov-config=.coveragerc-profit-fee \
            --cov=fee_matrix --cov=slippage_guard --cov=fast_scan_engine \
            --cov=profit_fee_algorithms --cov-fail-under=90 \
            --cov-report=xml:coverage.xml

      - name: Due diligence report smoke
        run: |
          # CI has no live probe history — seed a short OK window for the SLA gate.
          python - <<'PY'
          from uptime_monitor import record_probe
          for _ in range(12):
              record_probe(ok=True, source="ci_seed", latency_ms=1.0)
          PY
          python scripts/due_diligence_verify.py

      - name: Technical DD report smoke
        run: python scripts/technical_due_diligence_report.py --no-probe --smoke

      - name: Docker build smoke
        run: docker build -t blackdark-ci:test .
