name: CI Critical Gate Suite

# NOTE: This is NOT the entire tests/ tree. It is the risk-weighted institutional
# gate. A separate job runs the broader unit suite without claiming "full".

on:
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  critical:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blackdark
          POSTGRES_PASSWORD: blackdark
          POSTGRES_DB: blackdark_clean
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blackdark -d blackdark_clean"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BLACKDARK_TEST_DATABASE_URL: postgresql://blackdark:blackdark@127.0.0.1:5432/blackdark_clean
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==25.2"
          # Hash-locked + wheels-only (Sonar githubactions:S8541 / S8544).
          # Keep :all: inside a quoted/block string so YAML never parses it as a mapping.
          pip install --require-hashes --only-binary=:all: -r requirements.hashes.txt

      - name: Profit/fee + financial executability (90% gate)
        run: |
          python -m pytest tests/test_slippage_guard.py tests/test_fee_matrix.py \
            tests/test_profit_fee_algorithms.py tests/test_fast_scan_profit.py \
            tests/test_p0_financial_executability.py tests/test_money_decimal.py \
            -q --tb=short --cov-config=.coveragerc-profit-fee \
            --cov=fee_matrix --cov=slippage_guard --cov=fast_scan_engine \
            --cov=profit_fee_algorithms --cov=executable_edge_truth --cov=money_decimal \
            --cov-fail-under=85

      - name: Security / authz / session hardening
        run: |
          python -m pytest \
            tests/test_security.py \
            tests/test_security_hardening.py \
            tests/test_p0_authz_hardening.py \
            tests/test_p1_session_hardening.py \
            tests/test_production_guard.py \
            tests/test_service_bus_distributed.py \
            -q --tb=short

      - name: Postgres migration integrity
        run: |
          python -m pytest tests/test_postgres_backend.py tests/test_postgres_migration_integrity.py -q --tb=short

      - name: DD / heroes / ops closure
        run: |
          python -m pytest \
            tests/test_critical_ops_closure.py \
            tests/test_trust_os_execution.py \
            tests/test_heroes_strategy.py \
            tests/test_heroes_quality_polish.py \
            tests/test_radical_dd_scale_closure.py \
            -q --tb=short

      - name: Due diligence report smoke
        run: python scripts/due_diligence_verify.py --ci

      - name: Technical DD report smoke
        # --smoke: generate report without requiring buyer-strict overall=pass
        # (fresh CI runners have no seeded SQLite tables / uptime history).
        run: python scripts/technical_due_diligence_report.py --no-probe --smoke

      - name: Docker build smoke
        run: docker build -t blackdark-ci:test .

  # Broader suite inventory: run locally / nightly. As of remediation tip,
  # ~20 pre-existing failures remain outside the critical gate — do not claim
  # "full suite green" until those are closed. Critical job above is the merge gate.
