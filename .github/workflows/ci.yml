name: CI Critical Gate Suite

# NOTE: This is NOT the entire tests/ tree. It is the risk-weighted institutional
# gate. A separate job runs the broader unit suite without claiming "full".

on:
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  critical:
    name: CI Critical Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: blackdark
          POSTGRES_PASSWORD: blackdark
          POSTGRES_DB: blackdark_clean
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blackdark -d blackdark_clean"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Postgres tests monkeypatch config.DATABASE_URL; do not set DATABASE_URL here
      # or the whole job switches to Postgres and institutional gate steps time out.
      BLACKDARK_TEST_DATABASE_URL: postgresql://blackdark:blackdark@127.0.0.1:5432/blackdark_clean
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==25.2"
          # Hash-locked + wheels-only (Sonar githubactions:S8541 / S8544).
          # Keep :all: inside a quoted/block string so YAML never parses it as a mapping.
          pip install --require-hashes --only-binary=:all: -r requirements.hashes.txt

      - name: Profit/fee + financial executability (90% gate)
        run: |
          python -m pytest tests/test_slippage_guard.py tests/test_fee_matrix.py \
            tests/test_profit_fee_algorithms.py tests/test_fast_scan_profit.py \
            tests/test_p0_financial_executability.py tests/test_money_decimal.py \
            tests/test_rc2_financial_truth.py \
            -q --tb=short --cov-config=.coveragerc-profit-fee \
            --cov=fee_matrix --cov=slippage_guard --cov=fast_scan_engine \
            --cov=profit_fee_algorithms --cov=executable_edge_truth --cov=money_decimal \
            --cov-fail-under=85

      - name: Security / authz / session hardening
        run: |
          python -m pytest \
            tests/test_security.py \
            tests/test_security_hardening.py \
            tests/test_p0_authz_hardening.py \
            tests/test_p1_session_hardening.py \
            tests/test_production_guard.py \
            tests/test_service_bus_distributed.py \
            tests/test_rc2_chaos_resilience.py \
            -q --tb=short

      - name: Supply chain SBOM + license inventory
        run: |
          python scripts/generate_sbom.py
          python scripts/generate_license_inventory.py
          test -s docs/data-room/sbom/cyclonedx-python.json
          test -s docs/data-room/licenses/dependency_licenses.json
          python - <<'PY'
          import json
          from pathlib import Path
          sbom = json.loads(Path("docs/data-room/sbom/cyclonedx-python.json").read_text())
          assert sbom.get("bomFormat") == "CycloneDX"
          assert len(sbom.get("components") or []) >= 10
          lic = json.loads(Path("docs/data-room/licenses/dependency_licenses.json").read_text())
          assert lic.get("component_count", 0) >= 10
          print("sbom_ok", len(sbom["components"]), "license_ok", lic["component_count"])
          PY

      - name: Postgres migration integrity
        run: |
          python -m pytest tests/test_postgres_backend.py tests/test_postgres_migration_integrity.py -q --tb=short

      - name: DD / heroes / ops closure
        run: |
          python -m pytest \
            tests/test_critical_ops_closure.py \
            tests/test_trust_os_execution.py \
            tests/test_heroes_strategy.py \
            tests/test_heroes_quality_polish.py \
            tests/test_radical_dd_scale_closure.py \
            -q --tb=short

      - name: Due diligence report smoke
        run: python scripts/due_diligence_verify.py --ci

      - name: Technical DD report smoke
        # --smoke: generate report without requiring buyer-strict overall=pass
        # (fresh CI runners have no seeded SQLite tables / uptime history).
        run: python scripts/technical_due_diligence_report.py --no-probe --smoke

      - name: Require institutional crypto secrets
        env:
          AUDIT_SIGNING_KEY: ${{ secrets.AUDIT_SIGNING_KEY }}
          SECRETS_MASTER_KEY: ${{ secrets.SECRETS_MASTER_KEY }}
          SECRETS_VAULT_KEY: ${{ secrets.SECRETS_VAULT_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUDIT_SIGNING_KEY:-}" ]; then
            echo "::error::AUDIT_SIGNING_KEY is not set (configure repository or environment secret)"
            exit 1
          fi
          if [ -z "${SECRETS_MASTER_KEY:-}" ] && [ -z "${SECRETS_VAULT_KEY:-}" ]; then
            echo "::error::SECRETS_MASTER_KEY or SECRETS_VAULT_KEY must be set (configure repository or environment secret)"
            exit 1
          fi

      - name: CAP978 institutional gate (sample)
        env:
          ENV: institutional
          APP_ENV: institutional
          AUDIT_SIGNING_KEY: ${{ secrets.AUDIT_SIGNING_KEY }}
          SECRETS_MASTER_KEY: ${{ secrets.SECRETS_MASTER_KEY }}
          SECRETS_VAULT_KEY: ${{ secrets.SECRETS_VAULT_KEY }}
          SERVICE_BUS_LOCAL: "true"
          BLACKDARK_CI_DETERMINISTIC_CLOSURE: "true"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/bootstrap_free_human_ops.py --admin-email ci@blackdark.local
          python scripts/verify_institutional_closure.py --ci
          python scripts/run_soft_launch_closure.py
          set -a && source .env.softlaunch.local && set +a
          python -m pytest tests/cap646/test_institutional_gate.py tests/cap646/test_soft_launch_closure.py -q --tb=short -m "" -k "not test_institutional_gate_full"

      - name: Docker build smoke
        run: docker build -t blackdark-ci:test .

  owner-secret-verify:
    name: owner-hmac-secret-verify
    runs-on: ubuntu-latest
    needs: [critical]
    environment: institutional-closure
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==25.2"
          pip install --require-hashes --only-binary=:all: -r requirements.hashes.txt
      - name: Verify owner HMAC secret matches closure evidence
        env:
          INSTITUTIONAL_OWNER_APPROVAL_SECRET: ${{ secrets.INSTITUTIONAL_OWNER_APPROVAL_SECRET }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/verify_institutional_owner_secret.py

  # Local CAP646 batch01/02 proof (HTTP + RTM) — NOT Launch-57 items 1–57 closure
  # (see cap978/launch57_closure_scope.py + run_batch_verification_orchestrator.py note).
  # Failures are logged; they do not block CI Critical Gate / gate-full.
  batch-verification-orchestrator:
    name: batch-verification-orchestrator
    runs-on: ubuntu-latest
    needs: [owner-secret-verify]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==25.2"
          pip install --require-hashes --only-binary=:all: -r requirements.hashes.txt
      - name: Require institutional crypto secrets
        env:
          AUDIT_SIGNING_KEY: ${{ secrets.AUDIT_SIGNING_KEY }}
          SECRETS_MASTER_KEY: ${{ secrets.SECRETS_MASTER_KEY }}
          SECRETS_VAULT_KEY: ${{ secrets.SECRETS_VAULT_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUDIT_SIGNING_KEY:-}" ]; then
            echo "::error::AUDIT_SIGNING_KEY is not set (configure repository or environment secret)"
            exit 1
          fi
          if [ -z "${SECRETS_MASTER_KEY:-}" ] && [ -z "${SECRETS_VAULT_KEY:-}" ]; then
            echo "::error::SECRETS_MASTER_KEY or SECRETS_VAULT_KEY must be set (configure repository or environment secret)"
            exit 1
          fi

      - name: Run batch verification orchestrator (8 scripts)
        id: batch_verification_orchestrator
        continue-on-error: true
        env:
          ENV: institutional
          APP_ENV: institutional
          AUDIT_SIGNING_KEY: ${{ secrets.AUDIT_SIGNING_KEY }}
          SECRETS_MASTER_KEY: ${{ secrets.SECRETS_MASTER_KEY }}
          SECRETS_VAULT_KEY: ${{ secrets.SECRETS_VAULT_KEY }}
          SERVICE_BUS_LOCAL: "true"
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_batch_verification_orchestrator.py

      - name: Batch orchestrator outcome (informational)
        if: always()
        run: |
          if [ "${{ steps.batch_verification_orchestrator.outcome }}" != "success" ]; then
            echo "::warning::batch-verification-orchestrator did not reach all_verified=true (local CAP646 proof; external HTTP/RSS may be unavailable). Not a Launch-57 1–57 merge gate — see docs/CLOSURE_REJECT_02_REPORT.md."
            exit 0
          fi
          echo "batch-verification-orchestrator completed with all_verified=true"

  cap-dedup-gate:
    name: cap-dedup-gate
    runs-on: ubuntu-latest
    needs: [critical]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==25.2"
          pip install --require-hashes --only-binary=:all: -r requirements.hashes.txt
      - name: CAP dedup + batch03 leak gate
        run: python scripts/check_cap_dedup_gate.py

  gate-full-pr:
    name: gate-full
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [owner-secret-verify]
    environment: institutional-closure
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==25.2"
          pip install --require-hashes --only-binary=:all: -r requirements.hashes.txt
      - name: Require institutional crypto secrets
        env:
          AUDIT_SIGNING_KEY: ${{ secrets.AUDIT_SIGNING_KEY }}
          SECRETS_MASTER_KEY: ${{ secrets.SECRETS_MASTER_KEY }}
          SECRETS_VAULT_KEY: ${{ secrets.SECRETS_VAULT_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUDIT_SIGNING_KEY:-}" ]; then
            echo "::error::AUDIT_SIGNING_KEY is not set (configure repository or environment secret)"
            exit 1
          fi
          if [ -z "${SECRETS_MASTER_KEY:-}" ] && [ -z "${SECRETS_VAULT_KEY:-}" ]; then
            echo "::error::SECRETS_MASTER_KEY or SECRETS_VAULT_KEY must be set (configure repository or environment secret)"
            exit 1
          fi

      - name: Full institutional gate (required on PR)
        env:
          ENV: institutional
          APP_ENV: institutional
          AUDIT_SIGNING_KEY: ${{ secrets.AUDIT_SIGNING_KEY }}
          SECRETS_MASTER_KEY: ${{ secrets.SECRETS_MASTER_KEY }}
          SECRETS_VAULT_KEY: ${{ secrets.SECRETS_VAULT_KEY }}
          SERVICE_BUS_LOCAL: "true"
          PYTHONPATH: ${{ github.workspace }}
          INSTITUTIONAL_OWNER_APPROVAL_SECRET: ${{ secrets.INSTITUTIONAL_OWNER_APPROVAL_SECRET }}
        run: |
          python scripts/verify_institutional_owner_secret.py
          python scripts/verify_institutional_closure.py --full
          python -m pytest tests/cap646/test_institutional_gate.py::test_institutional_gate_full -q --tb=short -m ""
  # ~20 pre-existing failures remain outside the critical gate — do not claim
  # "full suite green" until those are closed. Critical job above is the merge gate.
